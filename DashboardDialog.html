<!DOCTYPE html>
<html lang="es">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <style>
      :root {
        color-scheme: light;
        --accent: <?= accentColor ?>;
        --bg: #f1f5f9;
        --surface: #ffffff;
        --surface-alt: #f8fafc;
        --text: #0f172a;
        --muted: #64748b;
        --border: #e2e8f0;
        --ok: #16a34a;
        --ok-bg: #dcfce7;
        --err: #dc2626;
        --err-bg: #fee2e2;
        --warn: #d97706;
        --warn-bg: #fef3c7;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 13px;
        line-height: 1.45;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        background: linear-gradient(135deg, var(--accent) 0%, #0f2b5b 100%);
        color: #fff;
        padding: 13px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        box-shadow: 0 2px 10px rgba(15, 23, 42, 0.14);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand-icon {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.16);
        display: grid;
        place-items: center;
      }
      .brand h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .brand p {
        margin: 1px 0 0;
        font-size: 11.5px;
        opacity: 0.86;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .segmented {
        display: inline-flex;
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 9px;
        padding: 2px;
      }
      .seg-btn {
        border: 0;
        background: transparent;
        color: rgba(255, 255, 255, 0.88);
        font-size: 12px;
        font-weight: 600;
        padding: 5px 10px;
        border-radius: 7px;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }
      .seg-btn.active {
        background: #ffffff;
        color: #0f172a;
      }
      .icon-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        background: rgba(255, 255, 255, 0.14);
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        padding: 6px 11px;
        border-radius: 8px;
        cursor: pointer;
      }
      .icon-btn:hover { background: rgba(255, 255, 255, 0.24); }
      .icon-btn:focus-visible, .seg-btn:focus-visible {
        outline: 2px solid #ffffff;
        outline-offset: 2px;
      }

      .main {
        padding: 16px 20px 22px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .health-strip {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 9px 14px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--surface-alt);
        border: 1px solid var(--border);
        color: #334155;
      }
      .pill.ok { background: var(--ok-bg); border-color: #bbf7d0; color: #166534; }
      .pill.warn { background: var(--warn-bg); border-color: #fde68a; color: #92400e; }
      .pill.err { background: var(--err-bg); border-color: #fecaca; color: #991b1b; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
      .mini-action {
        border: 0;
        background: #0f172a;
        color: #fff;
        border-radius: 999px;
        padding: 2px 8px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        margin-left: 2px;
      }
      .mini-action:disabled { opacity: 0.55; cursor: wait; }
      .updated-at {
        margin-left: auto;
        font-size: 11.5px;
        color: var(--muted);
      }

      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 10px;
      }
      .kpi-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 14px;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      }
      .kpi-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--muted);
        font-size: 11.5px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .kpi-val {
        font-size: 23px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: var(--text);
        line-height: 1.15;
      }
      .kpi-sub {
        margin-top: 5px;
        font-size: 11.5px;
        color: var(--muted);
      }
      .kpi-bar {
        margin-top: 7px;
        height: 5px;
        border-radius: 999px;
        background: #e2e8f0;
        overflow: hidden;
      }
      .kpi-bar > span {
        display: block;
        height: 100%;
        background: var(--ok);
        border-radius: 999px;
      }

      .charts-grid {
        display: grid;
        grid-template-columns: 1.65fr 1fr;
        gap: 12px;
      }
      .insights-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 16px;
        position: relative;
      }
      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }
      .panel-title {
        margin: 0;
        font-size: 13.5px;
        font-weight: 700;
        color: var(--text);
      }
      .legend-inline {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 11px;
        color: var(--muted);
      }
      .legend-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 2px;
        margin-right: 4px;
      }

      .chart-wrap {
        position: relative;
        width: 100%;
      }
      .svg-tooltip {
        position: absolute;
        pointer-events: none;
        background: #0f172a;
        color: #f8fafc;
        padding: 6px 9px;
        border-radius: 8px;
        font-size: 11.5px;
        box-shadow: 0 8px 18px rgba(15, 23, 42, 0.25);
        opacity: 0;
        transform: translate(-50%, -105%);
        transition: opacity 0.1s ease;
        white-space: nowrap;
        z-index: 10;
      }
      .svg-tooltip.visible { opacity: 1; }

      .donut-layout {
        display: flex;
        align-items: center;
        gap: 16px;
        min-height: 170px;
      }
      .donut-list {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .donut-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12.5px;
      }
      .donut-label {
        display: flex;
        align-items: center;
        gap: 7px;
        font-weight: 600;
      }
      .donut-swatch {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        flex-shrink: 0;
      }

      .origin-split {
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--border);
      }
      .origin-bar {
        display: flex;
        height: 10px;
        border-radius: 999px;
        overflow: hidden;
        background: #e2e8f0;
        margin-top: 6px;
      }
      .origin-labels {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: #334155;
        font-weight: 600;
      }

      .hbar-list {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .hbar-row {
        display: grid;
        grid-template-columns: 56px 1fr 56px;
        align-items: center;
        gap: 8px;
        font-size: 12px;
      }
      .hbar-ext {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-weight: 700;
        color: #1e293b;
        text-transform: uppercase;
      }
      .hbar-track {
        height: 8px;
        border-radius: 999px;
        background: #f1f5f9;
        overflow: hidden;
      }
      .hbar-fill {
        height: 100%;
        border-radius: 999px;
        background: var(--accent);
      }
      .hbar-num {
        text-align: right;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      [hidden] { display: none !important; }
      .user-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .user-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 6px 8px;
        border-radius: 8px;
        background: var(--surface-alt);
      }
      .user-row-btn {
        width: 100%;
        border: 1px solid transparent;
        text-align: left;
        font: inherit;
        color: inherit;
        cursor: pointer;
        transition: border-color 0.15s ease, background 0.15s ease;
      }
      .user-row-btn:hover {
        border-color: color-mix(in srgb, var(--accent) 42%, #cbd5e1);
        background: #eff6ff;
      }
      .user-row-btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .user-filter-hint {
        font-size: 11px;
        font-weight: 600;
        color: var(--accent);
        opacity: 0;
        transition: opacity 0.15s ease;
      }
      .user-row-btn:hover .user-filter-hint,
      .user-row-btn:focus-visible .user-filter-hint {
        opacity: 1;
      }
      .user-left {
        display: flex;
        align-items: center;
        gap: 9px;
        min-width: 0;
      }
      .avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: color-mix(in srgb, var(--accent) 16%, #ffffff);
        color: var(--accent);
        font-size: 11px;
        font-weight: 700;
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }
      .user-email {
        font-weight: 600;
        font-size: 12.5px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .user-stats {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .rate-badge {
        font-size: 11px;
        font-weight: 700;
        padding: 2px 7px;
        border-radius: 999px;
        background: var(--ok-bg);
        color: #166534;
      }

      .jobs-head {
        flex-wrap: wrap;
        gap: 10px;
      }
      .jobs-title-wrap {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }
      .scope-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 2px 9px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        background: #eff6ff;
        color: #1e40af;
        border: 1px solid #bfdbfe;
      }
      .toggle-all {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 5px 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface-alt);
        font-size: 12px;
        font-weight: 600;
        color: #1e293b;
        cursor: pointer;
        user-select: none;
        transition: border-color 0.15s ease, background 0.15s ease;
      }
      .toggle-all:hover {
        border-color: #cbd5e1;
        background: #f1f5f9;
      }
      .brand-chk {
        accent-color: var(--accent);
        width: 15px;
        height: 15px;
        cursor: pointer;
        margin: 0;
        flex-shrink: 0;
      }
      @supports not (accent-color: #1a73e8) {
        .toggle-all {
          position: relative;
          padding-left: 1.75rem;
        }
        .brand-chk {
          position: absolute !important;
          clip-path: inset(50%) !important;
          overflow: hidden !important;
          width: 1px !important;
          height: 1px !important;
          margin: -1px !important;
          padding: 0 !important;
          border: 0 !important;
          white-space: nowrap !important;
        }
        .brand-chk + span::before {
          content: "";
          position: absolute;
          left: 0.55rem;
          top: 50%;
          transform: translateY(-50%);
          width: 15px;
          height: 15px;
          border: 1.5px solid #94a3b8;
          background: #ffffff;
          border-radius: 4px;
          box-sizing: border-box;
        }
        .brand-chk:focus-visible + span::before {
          outline: 2px solid var(--accent);
          outline-offset: 2px;
        }
        .brand-chk:checked + span::before {
          background-color: var(--accent);
          border-color: var(--accent);
        }
        .brand-chk:checked + span::after {
          content: "✓";
          position: absolute;
          left: 0.68rem;
          top: 50%;
          transform: translateY(-54%);
          color: #ffffff;
          font-weight: 700;
          font-size: 11px;
        }
      }

      .jobs-controls {
        background: var(--surface-alt);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 10px;
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .filter-row {
        display: grid;
        grid-template-columns: minmax(210px, 1.8fr) repeat(4, minmax(125px, 1fr));
        gap: 8px;
        align-items: end;
      }
      .filter-field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      .filter-label {
        font-size: 11px;
        font-weight: 700;
        color: #475569;
      }
      .search-input-wrap {
        position: relative;
        display: flex;
        align-items: center;
      }
      .filter-input,
      .filter-select {
        width: 100%;
        height: 32px;
        padding: 0 9px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        background: #ffffff;
        color: var(--text);
        font: inherit;
        font-size: 12px;
        min-width: 0;
      }
      .filter-input {
        padding-right: 26px;
      }
      .filter-input:focus-visible,
      .filter-select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
        border-color: var(--accent);
      }
      .filter-input:disabled,
      .filter-select:disabled {
        background: #f1f5f9;
        color: #94a3b8;
        cursor: wait;
      }
      .search-clear-btn {
        position: absolute;
        right: 5px;
        width: 20px;
        height: 20px;
        border: 0;
        border-radius: 999px;
        background: #e2e8f0;
        color: #334155;
        font-size: 12px;
        line-height: 1;
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      .search-clear-btn:hover { background: #cbd5e1; }
      .search-clear-btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      .jobs-meta-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
        padding-top: 2px;
      }
      .jobs-summary {
        font-size: 12px;
        color: #475569;
        font-variant-numeric: tabular-nums;
      }
      .jobs-actions-bar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }
      .page-size-wrap {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11.5px;
        font-weight: 600;
        color: #475569;
      }
      .page-size-select {
        width: auto;
        height: 30px;
        padding: 0 8px;
      }
      .tool-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 30px;
        padding: 0 10px;
        border-radius: 7px;
        border: 1px solid #cbd5e1;
        background: #ffffff;
        color: #1e293b;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .tool-btn:hover:not(:disabled) {
        background: #f1f5f9;
        border-color: #94a3b8;
      }
      .tool-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .tool-btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .tool-btn-primary {
        border-color: color-mix(in srgb, var(--accent) 55%, #94a3b8);
        color: var(--accent);
        background: #ffffff;
      }
      .tool-btn-primary:hover:not(:disabled) {
        background: #eff6ff;
      }

      .table-wrap {
        overflow-x: auto;
        max-inline-size: 100%;
      }
      .table-wrap:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 8px;
      }
      .table-wrap.is-scrollable {
        overflow: auto;
        max-block-size: min(520px, 65vh);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        font-size: 12px;
      }
      thead {
        position: sticky;
        inset-block-start: 0;
        z-index: 2;
      }
      th {
        text-align: left;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: var(--muted);
        background: var(--surface-alt);
        padding: 8px 9px;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }
      td {
        padding: 7px 9px;
        border-bottom: 1px solid #f1f5f9;
        color: #1e293b;
        vertical-align: middle;
      }
      tr:last-child td { border-bottom: 0; }
      .file-cell {
        max-width: 195px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 500;
      }
      .fam-chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        font-weight: 600;
        color: #334155;
        white-space: nowrap;
      }
      .fam-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .status-pill {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
      }
      .status-OK { background: var(--ok-bg); color: #166534; }
      .status-ERROR { background: var(--err-bg); color: #991b1b; }
      .status-RECHAZADO { background: var(--warn-bg); color: #92400e; }

      .jobs-pagination {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
        font-size: 12px;
        color: #475569;
      }
      .pager-controls {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .pager-label {
        font-weight: 600;
        padding: 0 4px;
        font-variant-numeric: tabular-nums;
      }
      .safeguard-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
        width: 100%;
        padding: 8px 10px;
        border-radius: 8px;
        background: var(--warn-bg);
        border: 1px solid #fde68a;
        color: #92400e;
        font-size: 12px;
        font-weight: 600;
      }
      .safeguard-actions {
        display: inline-flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      .dash-alert {
        margin: 12px 20px 0;
        padding: 10px 14px;
        border-radius: 10px;
        background: var(--err-bg);
        border: 1px solid #fecaca;
        color: #991b1b;
        font-size: 12.5px;
        font-weight: 600;
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .dash-alert.visible { display: flex; }

      .empty-box {
        text-align: center;
        padding: 36px 20px;
        color: var(--muted);
      }
      .loading-box {
        display: grid;
        gap: 12px;
      }
      .skel {
        height: 92px;
        border-radius: 12px;
        background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
        background-size: 200% 100%;
        animation: shimmer 1.2s infinite;
      }
      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      .skel-tr td {
        padding-top: 10px;
        padding-bottom: 10px;
      }
      .skel-cell {
        display: inline-block;
        height: 11px;
        border-radius: 6px;
        background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
        background-size: 200% 100%;
        animation: shimmer 1.2s infinite;
        vertical-align: middle;
      }

      /* Spinner nativo accesible sobre <progress> indeterminado */
      @property --arc-start {
        syntax: "<angle>";
        inherits: false;
        initial-value: 0deg;
      }
      @property --arc-end {
        syntax: "<angle>";
        inherits: false;
        initial-value: 0deg;
      }
      @property --progress-dash-animation {
        syntax: "*";
        inherits: false;
        initial-value: , progress-dash 3s ease-in-out infinite;
      }
      progress.loading-spinner:indeterminate::-webkit-progress-bar {
        display: none;
        background: none;
      }
      progress.loading-spinner:indeterminate::-webkit-progress-value {
        display: none;
        background: none;
      }
      progress.loading-spinner:indeterminate::-moz-progress-bar {
        display: none;
        background: none;
      }
      progress.loading-spinner:indeterminate::slider-fill {
        display: none;
        background: none;
      }
      progress.loading-spinner:indeterminate {
        --_from: calc(90deg + var(--arc-start, 0deg));
        --_to: calc(90deg + var(--arc-end, 158deg));
        --size: 16px;
        --thickness: 2px;
        --spinner-color: var(--accent);
        --track-color: #dbeafe;
        --spinner-duration: 1.2s;
        --_used-spinner-duration: var(--spinner-duration);

        position: relative;
        flex-shrink: 0;
        width: var(--size);
        height: var(--size);
        border-radius: 50%;
        appearance: none;
        background: conic-gradient(
            from var(--_from),
            var(--spinner-color) calc(var(--_to) - var(--_from)),
            transparent 0
          )
          var(--track-color);
        animation:
          progress-spin var(--_used-spinner-duration) linear infinite
          var(--progress-dash-animation, );
      }
      progress.loading-spinner[hidden] { display: none; }
      @supports (background-clip: border-area) {
        progress.loading-spinner:indeterminate {
          background-clip: border-area;
          border: var(--thickness) solid transparent;
          background-origin: border-box;
        }
      }
      @supports not (background-clip: border-area) {
        progress.loading-spinner:indeterminate {
          --clip-boundary: calc(100% - var(--thickness));
          -webkit-mask-image: radial-gradient(
            farthest-side,
            transparent var(--clip-boundary),
            black var(--clip-boundary)
          );
          mask-image: radial-gradient(
            farthest-side,
            transparent var(--clip-boundary),
            black var(--clip-boundary)
          );
          border: 0;
        }
      }
      @media (forced-colors: active) {
        progress.loading-spinner:indeterminate {
          forced-color-adjust: none;
          --spinner-color: CanvasText;
          --track-color: Canvas;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .skel, .skel-cell {
          animation: none;
        }
        progress.loading-spinner:indeterminate {
          --_used-spinner-duration: 6s;
          --progress-dash-animation: ;
          --arc-end: 158deg;
        }
      }
      @keyframes progress-spin {
        to { rotate: 1turn; }
      }
      @keyframes progress-dash {
        from { --arc-start: 0deg; --arc-end: 3deg; }
        50% { --arc-start: 100deg; --arc-end: 358deg; }
        to { --arc-start: 360deg; --arc-end: 363deg; }
      }
      @media (max-width: 780px) {
        .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .charts-grid, .insights-grid { grid-template-columns: 1fr; }
        .filter-row { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
          </svg>
        </div>
        <div>
          <h1>Resumen y analítica · <?= appName ?></h1>
          <p>Panel de control administrativo basado en la pestaña Auditoría · <?= version ?></p>
        </div>
      </div>

      <div class="controls">
        <div class="segmented" role="group" aria-label="Periodo de análisis">
          <button type="button" class="seg-btn" data-days="7" onclick="changePeriod(7)">7 días</button>
          <button type="button" class="seg-btn active" data-days="30" onclick="changePeriod(30)">30 días</button>
          <button type="button" class="seg-btn" data-days="90" onclick="changePeriod(90)">90 días</button>
          <button type="button" class="seg-btn" data-days="0" onclick="changePeriod(0)">Todo</button>
        </div>
        <button type="button" class="icon-btn" onclick="refreshDashboard()" title="Actualizar datos">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
          Actualizar
        </button>
        <button type="button" class="icon-btn" onclick="google.script.host.close()" title="Cerrar panel">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
          Cerrar
        </button>
      </div>
    </header>

    <div id="dashAlertBanner" class="dash-alert" role="alert">
      <span id="dashAlertText"></span>
      <button type="button" class="mini-action" onclick="clearDashAlert()">Ocultar</button>
    </div>

    <main id="content" class="main">
      <div class="loading-box">
        <div class="skel"></div>
        <div class="skel" style="height: 200px;"></div>
        <div class="skel" style="height: 160px;"></div>
      </div>
    </main>

    <script>
      const DIALOG_TOKEN = '<?= dialogToken ?>';
      const DASH_LOCALE = '<?= locale ?>' || 'es-ES';
      const DEFAULT_ALL_RENDER_LIMIT = 500;
      const FAMILY_ORDER = ['DOCUMENTOS', 'HOJAS', 'PRESENTACIONES', 'TEXTO', 'OTROS'];
      const FAMILY_META = {
        DOCUMENTOS: { label: 'Documentos', short: 'Documentos', color: '#1a73e8' },
        HOJAS: { label: 'Hojas de cálculo', short: 'Hojas', color: '#188038' },
        PRESENTACIONES: { label: 'Presentaciones', short: 'Presentaciones', color: '#e37400' },
        TEXTO: { label: 'Texto y marcado', short: 'Texto', color: '#7c3aed' },
        OTROS: { label: 'Sin familia / Otros', short: 'Otros', color: '#64748b' }
      };
      const STATUS_LABELS = {
        OK: 'OK',
        RECHAZADO: 'Rechazado',
        ERROR: 'Error'
      };
      const ORIGIN_LABELS = {
        LOCAL: 'Archivo local',
        DRIVE: 'Enlace Drive'
      };

      let currentDays = 30;
      let lastDashboardData = null;
      let allJobsCache = null;
      let allJobsLoading = false;
      let allJobsError = '';
      let searchDebounceTimer = null;
      let jobsUiState = {
        showAll: false,
        search: '',
        user: '',
        family: '',
        status: '',
        origin: '',
        pageSize: 20,
        page: 1,
        allRenderLimit: DEFAULT_ALL_RENDER_LIMIT
      };

      function formatNum(val, minDec, maxDec) {
        const n = Number(val);
        if (!isFinite(n)) return '0';
        const opts = {};
        if (typeof minDec === 'number') opts.minimumFractionDigits = minDec;
        if (typeof maxDec === 'number') opts.maximumFractionDigits = maxDec;
        try {
          return new Intl.NumberFormat(DASH_LOCALE, opts).format(n);
        } catch (e) {
          return new Intl.NumberFormat('es-ES', opts).format(n);
        }
      }

      function showDashAlert(msg) {
        const banner = document.getElementById('dashAlertBanner');
        const txt = document.getElementById('dashAlertText');
        if (!banner || !txt) return;
        txt.textContent = msg || 'Se ha producido un error.';
        banner.classList.add('visible');
      }

      function clearDashAlert() {
        const banner = document.getElementById('dashAlertBanner');
        if (banner) banner.classList.remove('visible');
      }

      function escapeHtml(value) {
        return String(value === null || value === undefined ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function normalizeText(value) {
        const raw = String(value === null || value === undefined ? '' : value).replace(/\u200B/g, '');
        if (typeof raw.normalize === 'function') {
          return raw.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        }
        return raw.toLowerCase();
      }

      function normalizeJobFamily(family) {
        const key = String(family || '').trim().toUpperCase();
        if (key === 'DOCUMENTOS' || key === 'HOJAS' || key === 'PRESENTACIONES' || key === 'TEXTO') {
          return key;
        }
        return 'OTROS';
      }

      function normalizeJobOrigin(origin) {
        return String(origin || '').toLowerCase().indexOf('drive') !== -1 ? 'DRIVE' : 'LOCAL';
      }

      function normalizeJobStatus(status) {
        const st = String(status || '').trim().toUpperCase();
        if (st === 'OK' || st === 'RECHAZADO' || st === 'ERROR') return st;
        return 'ERROR';
      }

      function prepareJobsCache(rawJobs) {
        const src = Array.isArray(rawJobs) ? rawJobs : [];
        const prepared = [];
        for (let i = 0; i < src.length; i++) {
          const job = src[i];
          if (!job) continue;
          const familyKey = normalizeJobFamily(job.family);
          const originKey = normalizeJobOrigin(job.origin);
          const statusKey = normalizeJobStatus(job.status);
          const famMeta = FAMILY_META[familyKey] || FAMILY_META.OTROS;
          const cleanFile = String(job.file || '').replace(/\u200B/g, '');
          const searchBlob = normalizeText([
            cleanFile,
            job.ext ? '.' + job.ext : '',
            job.ext || '',
            job.user || '',
            job.jobId || '',
            job.detail || '',
            job.origin || '',
            statusKey,
            famMeta.label
          ].join(' '));

          prepared.push(Object.assign({}, job, {
            file: cleanFile,
            _familyKey: familyKey,
            _originKey: originKey,
            _statusKey: statusKey,
            _searchBlob: searchBlob
          }));
        }
        return prepared;
      }

      function formatDuration(ms) {
        if (!ms) return '0 ms';
        if (ms < 1000) return formatNum(ms, 0, 0) + ' ms';
        return formatNum(ms / 1000, 1, 1) + ' s';
      }

      function formatKb(kb) {
        if (!kb) return '0 KB';
        if (kb >= 1024) return formatNum(kb / 1024, 2, 2) + ' MB';
        return formatNum(kb, 1, 1) + ' KB';
      }

      function refreshDashboard() {
        allJobsCache = null;
        allJobsError = '';
        loadAnalytics();
      }

      function changePeriod(days) {
        currentDays = days;
        const buttons = document.querySelectorAll('.seg-btn');
        for (let i = 0; i < buttons.length; i++) {
          buttons[i].classList.toggle('active', Number(buttons[i].dataset.days) === days);
        }
        loadAnalytics();
      }

      function loadAnalytics() {
        clearDashAlert();
        const container = document.getElementById('content');
        container.innerHTML = '<div class="loading-box"><div class="skel"></div><div class="skel" style="height:200px"></div></div>';

        google.script.run
          .withSuccessHandler(function (res) {
            if (!res || !res.success) {
              renderError((res && res.error) || 'No se pudieron obtener los datos de Auditoría.');
              return;
            }
            renderDashboard(res.data);
          })
          .withFailureHandler(function (err) {
            renderError(err.message || 'Error al cargar analítica.');
          })
          .apiGetDashboardAnalytics(currentDays, DIALOG_TOKEN);
      }

      function renderError(msg) {
        document.getElementById('content').innerHTML =
          '<div class="panel empty-box"><h3>Error cargando el resumen</h3><p>' + escapeHtml(msg) + '</p></div>';
      }

      function triggerInstallFromDash(btn) {
        clearDashAlert();
        btn.disabled = true;
        btn.textContent = 'Instalando...';
        google.script.run
          .withSuccessHandler(function (res) {
            if (res && res.success) {
              loadAnalytics();
            } else {
              btn.disabled = false;
              btn.textContent = 'Instalar';
              showDashAlert((res && res.error) || 'No se pudo instalar el trigger diario.');
            }
          })
          .withFailureHandler(function (e) {
            btn.disabled = false;
            btn.textContent = 'Instalar';
            showDashAlert((e && e.message) || 'Error al instalar el trigger diario.');
          })
          .apiInstallTriggerFromDialog(DIALOG_TOKEN);
      }

      function purgeTempFromDash(btn) {
        clearDashAlert();
        btn.disabled = true;
        btn.textContent = 'Purgando...';
        google.script.run
          .withSuccessHandler(function (res) {
            if (res && res.success) {
              loadAnalytics();
            } else {
              btn.disabled = false;
              btn.textContent = 'Purgar';
              showDashAlert((res && res.error) || 'No se pudieron purgar los archivos temporales.');
            }
          })
          .withFailureHandler(function (e) {
            btn.disabled = false;
            btn.textContent = 'Purgar';
            showDashAlert((e && e.message) || 'Error al purgar temporales.');
          })
          .apiPurgeTempFilesFromDialog(DIALOG_TOKEN);
      }

      function renderBarChartSvg(series) {
        if (!series || series.length === 0) {
          return '<div class="empty-box" style="padding:28px">Sin actividad registrada en el periodo seleccionado.</div>';
        }
        const W = 560;
        const H = 195;
        const padL = 32;
        const padR = 10;
        const padT = 14;
        const padB = 28;
        const plotW = W - padL - padR;
        const plotH = H - padT - padB;

        let maxTotal = 1;
        for (let i = 0; i < series.length; i++) {
          if (series[i].total > maxTotal) maxTotal = series[i].total;
        }
        const yTicks = [0, Math.ceil(maxTotal / 2), maxTotal];
        let gridHtml = '';
        for (let t = 0; t < yTicks.length; t++) {
          const val = yTicks[t];
          const y = padT + plotH - (val / maxTotal) * plotH;
          gridHtml += '<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + y.toFixed(1) + '" stroke="#e2e8f0" stroke-dasharray="3 3"/>';
          gridHtml += '<text x="' + (padL - 6) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end" font-size="10" fill="#64748b">' + val + '</text>';
        }

        const step = plotW / series.length;
        const barW = Math.max(4, Math.min(26, step * 0.66));
        const labelEvery = series.length > 16 ? Math.ceil(series.length / 8) : (series.length > 9 ? 2 : 1);

        let barsHtml = '';
        for (let i = 0; i < series.length; i++) {
          const d = series[i];
          const cx = padL + i * step + step / 2;
          const x = cx - barW / 2;
          let yCursor = padT + plotH;

          const segments = [
            { count: d.ok, color: '#1a73e8' },
            { count: d.rejected, color: '#f59e0b' },
            { count: d.error, color: '#ef4444' }
          ];
          for (let s = 0; s < segments.length; s++) {
            const seg = segments[s];
            if (seg.count <= 0) continue;
            const h = (seg.count / maxTotal) * plotH;
            yCursor -= h;
            barsHtml += '<rect x="' + x.toFixed(1) + '" y="' + yCursor.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + Math.max(1.5, h).toFixed(1) + '" rx="2" fill="' + seg.color + '"/>';
          }

          barsHtml += '<rect class="bar-hit" x="' + (padL + i * step).toFixed(1) + '" y="' + padT + '" width="' + step.toFixed(1) + '" height="' + plotH + '" fill="transparent" data-idx="' + i + '"/>';

          if (i % labelEvery === 0 || i === series.length - 1) {
            barsHtml += '<text x="' + cx.toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10" fill="#64748b">' + escapeHtml(d.label) + '</text>';
          }
        }

        return '<div class="chart-wrap">' +
          '<svg id="dailyChartSvg" viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="195" role="img" aria-label="Actividad diaria">' +
          gridHtml + barsHtml +
          '</svg>' +
          '<div id="barTooltip" class="svg-tooltip"></div>' +
          '</div>';
      }

      function renderDonutSvg(byFamily, totalCount) {
        if (!byFamily || byFamily.length === 0) {
          return '<div class="empty-box" style="padding:28px">Sin datos de formatos todavía.</div>';
        }
        const r = 46;
        const c = 2 * Math.PI * r;
        let offset = 0;
        let arcs = '';

        for (let i = 0; i < byFamily.length; i++) {
          const fam = byFamily[i];
          const dash = (fam.percent / 100) * c;
          arcs += '<circle cx="64" cy="64" r="' + r + '" fill="none" stroke="' + escapeHtml(fam.color) + '" stroke-width="18" stroke-dasharray="' + dash.toFixed(2) + ' ' + (c - dash).toFixed(2) + '" stroke-dashoffset="' + (-offset).toFixed(2) + '" transform="rotate(-90 64 64)"/>';
          offset += dash;
        }

        let legend = '';
        for (let i = 0; i < byFamily.length; i++) {
          const fam = byFamily[i];
          legend += '<div class="donut-item">' +
            '<span class="donut-label"><span class="donut-swatch" style="background:' + escapeHtml(fam.color) + '"></span>' + escapeHtml(fam.label) + '</span>' +
            '<span style="color:#475569;font-variant-numeric:tabular-nums;"><b>' + formatNum(fam.count, 0, 0) + '</b> (' + formatNum(fam.percent, 0, 1) + '%)</span>' +
            '</div>';
        }

        return '<div class="donut-layout">' +
          '<svg width="128" height="128" viewBox="0 0 128 128" style="flex-shrink:0" aria-label="Distribución por familia">' +
          '<circle cx="64" cy="64" r="' + r + '" fill="none" stroke="#f1f5f9" stroke-width="18"/>' +
          arcs +
          '<text x="64" y="61" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">' + formatNum(totalCount, 0, 0) + '</text>' +
          '<text x="64" y="77" text-anchor="middle" font-size="10.5" fill="#64748b">trabajos</text>' +
          '</svg>' +
          '<div class="donut-list">' + legend + '</div>' +
          '</div>';
      }

      function renderJobRowHtml(job, isFullMode) {
        const famKey = normalizeJobFamily(job._familyKey || job.family);
        const famMeta = FAMILY_META[famKey] || FAMILY_META.OTROS;
        const statusKey = normalizeJobStatus(job._statusKey || job.status);
        const dateLabel = isFullMode ? (job.timestampFull || job.timestamp) : job.timestamp;
        const dateTitle = job.timestampFull || job.timestamp || '';
        const fileName = String(job.file || '').replace(/\u200B/g, '');

        return '<tr>' +
          '<td style="white-space:nowrap" title="' + escapeHtml(dateTitle) + '">' + escapeHtml(dateLabel) + '</td>' +
          '<td class="file-cell" title="' + escapeHtml(job.user) + '">' + escapeHtml(job.user) + '</td>' +
          '<td>' + escapeHtml(job.origin) + '</td>' +
          '<td class="file-cell" title="' + escapeHtml(fileName) + '">' + escapeHtml(fileName) + '</td>' +
          '<td><code>' + escapeHtml(job.ext ? '.' + job.ext : '—') + '</code></td>' +
          '<td><span class="fam-chip"><span class="fam-dot" style="background:' + escapeHtml(famMeta.color) + '"></span>' + escapeHtml(famMeta.short) + '</span></td>' +
          '<td style="white-space:nowrap">' + formatKb(job.inputKB) + ' → ' + formatKb(job.pdfKB) + '</td>' +
          '<td style="white-space:nowrap">' + formatDuration(job.durationMs) + '</td>' +
          '<td title="' + escapeHtml(job.detail) + '"><span class="status-pill status-' + statusKey + '">' + escapeHtml(statusKey) + '</span></td>' +
          '</tr>';
      }

      function renderCompactRecentRows(recentJobs) {
        const rows = Array.isArray(recentJobs) ? recentJobs : [];
        if (rows.length === 0) {
          return '<tr><td colspan="9" style="text-align:center;color:#64748b;padding:20px;">Sin trabajos recientes en este periodo.</td></tr>';
        }
        let html = '';
        for (let i = 0; i < rows.length; i++) {
          html += renderJobRowHtml(rows[i], false);
        }
        return html;
      }

      function renderDashboard(data) {
        lastDashboardData = data;
        const k = data.kpis;
        const h = data.health || {};
        const originTotal = (data.byOrigin.local || 0) + (data.byOrigin.drive || 0);
        const localPct = originTotal > 0 ? Math.round((data.byOrigin.local / originTotal) * 100) : 0;
        const drivePct = originTotal > 0 ? 100 - localPct : 0;

        let html = '';

        // Barra de estado del sistema
        html += '<section class="health-strip" aria-label="Estado del servicio">' +
          '<span class="pill ' + (h.serviceActive ? 'ok' : 'warn') + '"><span class="dot"></span>' + (h.serviceActive ? 'Servicio activo' : 'En mantenimiento') + '</span>' +
          '<span class="pill ' + (h.hasTrigger ? 'ok' : 'warn') + '"><span class="dot"></span>' + (h.hasTrigger ? 'Trigger diario activo' : 'Sin trigger diario') +
            (!h.hasTrigger ? ' <button type="button" class="mini-action" onclick="triggerInstallFromDash(this)">Instalar</button>' : '') +
          '</span>' +
          '<span class="pill ' + ((h.tempFilesCount || 0) > 0 ? 'warn' : 'ok') + '"><span class="dot"></span>Temporales en Drive: ' + formatNum(h.tempFilesCount || 0, 0, 0) +
            ((h.tempFilesCount || 0) > 0 ? ' <button type="button" class="mini-action" onclick="purgeTempFromDash(this)">Purgar</button>' : '') +
          '</span>' +
          '<span class="pill">Límites: ' + formatNum(h.maxSizeMB || 20, 0, 1) + ' MB · ' + (h.dailyLimit ? formatNum(h.dailyLimit, 0, 0) + '/día' : 'Sin cuota') + ' · Auditoría: ' + escapeHtml(h.auditNameMode || 'COMPLETO') + '</span>' +
          '<span class="updated-at">Actualizado: ' + escapeHtml(data.generatedAt) + '</span>' +
          '</section>';

        // 5 KPIs
        html += '<section class="kpi-grid">' +
          '<div class="kpi-card"><div class="kpi-top"><span>Total trabajos</span></div><div class="kpi-val">' + formatNum(k.total, 0, 0) + '</div><div class="kpi-sub">' + formatNum(k.ok, 0, 0) + ' OK · ' + formatNum(k.error, 0, 0) + ' err · ' + formatNum(k.rejected, 0, 0) + ' rech.</div></div>' +
          '<div class="kpi-card"><div class="kpi-top"><span>Tasa de éxito</span></div><div class="kpi-val">' + formatNum(k.successRate, 0, 1) + '%</div><div class="kpi-bar"><span style="width:' + Math.min(100, k.successRate) + '%"></span></div></div>' +
          '<div class="kpi-card"><div class="kpi-top"><span>Conversiones hoy</span></div><div class="kpi-val">' + formatNum(k.todayCount, 0, 0) + '</div><div class="kpi-sub">Trabajos OK en la fecha actual</div></div>' +
          '<div class="kpi-card"><div class="kpi-top"><span>Usuarios únicos</span></div><div class="kpi-val">' + formatNum(k.uniqueUsers, 0, 0) + '</div><div class="kpi-sub">Cuentas activas en el periodo</div></div>' +
          '<div class="kpi-card"><div class="kpi-top"><span>Tiempo medio</span></div><div class="kpi-val">' + formatDuration(k.avgDurationMs) + '</div><div class="kpi-sub"><span title="Percentil 95: el 95 % de las conversiones tardaron este tiempo o menos" style="border-bottom:1px dotted currentColor;cursor:help;">p95</span>: ' + formatDuration(k.p95DurationMs) + ' · ' + formatNum(k.totalPdfMB, 2, 2) + ' MB PDF</div></div>' +
          '</section>';

        if ((h.totalAuditRows || 0) === 0) {

        let usersHtml = '';

          const u = data.topUsers[i];
          const initials = (u.email.slice(0, 2) || 'US').toUpperCase();

            '<div class="user-left"><span class="avatar">' + escapeHtml(initials) + '</span><span class="user-email">' + escapeHtml(u.email) + '</span></div>' +
            '<div class="user-stats"><span class="user-filter-hint">Filtrar</span><b>' + formatNum(u.total, 0, 0) + '</b><span class="rate-badge">' + formatNum(u.successRate, 0, 1) + '% OK</span></div>' +
            '</button>';
        }

        html += '<section class="insights-grid">' +
          '<div class="panel">' +
            '<div class="panel-head"><h2 class="panel-title">Origen y formatos principales</h2></div>' +
            '<div class="origin-split">' +
              '<div class="origin-labels"><span>Archivo local: ' + formatNum(data.byOrigin.local, 0, 0) + ' (' + formatNum(localPct, 0, 0) + '%)</span><span>Enlace Drive: ' + formatNum(data.byOrigin.drive, 0, 0) + ' (' + formatNum(drivePct, 0, 0) + '%)</span></div>' +
              '<div class="origin-bar"><div style="width:' + localPct + '%;background:#1a73e8"></div><div style="width:' + drivePct + '%;background:#0ea5e9"></div></div>' +
            '</div>' +
            '<div class="hbar-list">' + (extHtml || '<span style="color:#64748b">Sin extensiones registradas</span>') + '</div>' +

          '<div class="panel">' +
            '<div class="panel-head"><h2 class="panel-title">Usuarios más activos</h2><span style="font-size:11px;color:#64748b">Clic para filtrar</span></div>' +

          '</div>' +
          '</section>';

        // Sección de trabajos (compacta por defecto + explorador completo desplegable bajo demanda)
        html += '<section id="jobsPanel" class="panel jobs-panel">' +
          '<div class="panel-head jobs-head">' +
            '<div class="jobs-title-wrap">' +
              '<h2 id="jobsPanelTitle" class="panel-title">Actividad reciente (últimos 20 trabajos)</h2>' +
              '<progress id="jobsLoadingSpinner" class="loading-spinner" aria-label="Cargando trabajos de Auditoría" hidden></progress>' +
              '<span id="jobsScopeBadge" class="scope-badge" hidden></span>' +
            '</div>' +
            '<label class="toggle-all" for="showAllJobsChk">' +
              '<input type="checkbox" id="showAllJobsChk" class="brand-chk">' +
              '<span>Mostrar todos los trabajos de la hoja</span>' +
            '</label>' +
          '</div>' +

          '<div id="jobsControls" class="jobs-controls" hidden>' +
            '<div class="filter-row">' +
              '<div class="filter-field">' +
                '<label class="filter-label" for="jobsSearchInput">Buscar</label>' +
                '<div class="search-input-wrap">' +
                  '<input type="search" id="jobsSearchInput" class="filter-input" placeholder="Archivo, usuario, extensión o detalle..." autocomplete="off">' +
                  '<button type="button" id="jobsSearchClearBtn" class="search-clear-btn" title="Limpiar búsqueda" aria-label="Limpiar búsqueda" hidden>×</button>' +
                '</div>' +
              '</div>' +
              '<div class="filter-field">' +
                '<label class="filter-label" for="jobsUserSelect">Usuario</label>' +
                '<select id="jobsUserSelect" class="filter-select"><option value="">Todos los usuarios</option></select>' +
              '</div>' +
              '<div class="filter-field">' +
                '<label class="filter-label" for="jobsFamilySelect">Familia</label>' +
                '<select id="jobsFamilySelect" class="filter-select"><option value="">Todas las familias</option></select>' +
              '</div>' +

                '<label class="filter-label" for="jobsStatusSelect">Estado</label>' +
                '<select id="jobsStatusSelect" class="filter-select"><option value="">Todos los estados</option></select>' +

                '<label class="filter-label" for="jobsOriginSelect">Origen</label>' +

              '<div id="jobsFilterSummary" class="jobs-summary" aria-live="polite"></div>' +

                '<button type="button" id="jobsClearFiltersBtn" class="tool-btn" hidden>Limpiar filtros</button>' +

                  '<select id="jobsPageSizeSelect" class="filter-select page-size-select">' +

      function attachUserRowHandlers() {
        const btns = document.querySelectorAll('.user-row-btn');
        for (let i = 0; i < btns.length; i++) {
          btns[i].addEventListener('click', function (e) {
            const email = e.currentTarget.getAttribute('data-user') || '';
            if (email) filterJobsByUser(email);
          });
        }
      }

      function attachJobsControlsHandlers() {
        const chk = document.getElementById('showAllJobsChk');
        const searchInput = document.getElementById('jobsSearchInput');
        const searchClear = document.getElementById('jobsSearchClearBtn');
        const userSelect = document.getElementById('jobsUserSelect');
        const familySelect = document.getElementById('jobsFamilySelect');
        const statusSelect = document.getElementById('jobsStatusSelect');
        const originSelect = document.getElementById('jobsOriginSelect');
        const clearBtn = document.getElementById('jobsClearFiltersBtn');
        const pageSizeSelect = document.getElementById('jobsPageSizeSelect');
        const exportBtn = document.getElementById('jobsExportCsvBtn');
        const pager = document.getElementById('jobsPagination');
        const tbody = document.getElementById('jobsTableBody');

        if (chk) {
          chk.addEventListener('change', function () {
            toggleShowAllJobs(chk.checked);
          });
        }

        if (searchInput) {
          searchInput.addEventListener('input', function () {
            jobsUiState.search = searchInput.value;
            jobsUiState.page = 1;
            if (searchClear) searchClear.hidden = !searchInput.value;
            if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
            searchDebounceTimer = setTimeout(function () {
              if (jobsUiState.showAll && allJobsCache !== null) renderJobsExplorer();
            }, 140);
          });
        }

        if (searchClear && searchInput) {
          searchClear.addEventListener('click', function () {
            if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
            searchInput.value = '';
            jobsUiState.search = '';
            jobsUiState.page = 1;
            searchClear.hidden = true;
            searchInput.focus();
            if (jobsUiState.showAll && allJobsCache !== null) renderJobsExplorer();
          });
        }

        function bindSelect(sel, stateKey) {
          if (!sel) return;
          sel.addEventListener('change', function () {
            jobsUiState[stateKey] = sel.value;
            jobsUiState.page = 1;
            jobsUiState.allRenderLimit = DEFAULT_ALL_RENDER_LIMIT;
            if (jobsUiState.showAll && allJobsCache !== null) renderJobsExplorer();
          });
        }

        bindSelect(userSelect, 'user');
        bindSelect(familySelect, 'family');
        bindSelect(statusSelect, 'status');
        bindSelect(originSelect, 'origin');

        if (clearBtn) {
          clearBtn.addEventListener('click', clearAllJobsFilters);
        }

        if (pageSizeSelect) {
          pageSizeSelect.addEventListener('change', function () {
            jobsUiState.pageSize = Number(pageSizeSelect.value);
            jobsUiState.page = 1;
            jobsUiState.allRenderLimit = DEFAULT_ALL_RENDER_LIMIT;
            if (jobsUiState.showAll && allJobsCache !== null) {
              renderJobsExplorer();
              const wrap = document.getElementById('jobsTableWrap');
              if (wrap) wrap.scrollTop = 0;
            }
          });
        }

        if (exportBtn) {
          exportBtn.addEventListener('click', exportFilteredJobsCsv);
        }

        if (pager) {
          pager.addEventListener('click', function (e) {
            const btn = e.target.closest('button[data-action]');
            if (!btn || btn.disabled) return;
            const action = btn.getAttribute('data-action');
            if (action === 'first') {
              jobsUiState.page = 1;
            } else if (action === 'prev') {
              jobsUiState.page = Math.max(1, jobsUiState.page - 1);
            } else if (action === 'next') {
              const totalPages = Number(btn.getAttribute('data-total-pages')) || 1;
              jobsUiState.page = Math.min(totalPages, jobsUiState.page + 1);
            } else if (action === 'last') {
              jobsUiState.page = Number(btn.getAttribute('data-total-pages')) || 1;
            } else if (action === 'more500') {
              jobsUiState.allRenderLimit += DEFAULT_ALL_RENDER_LIMIT;
            } else if (action === 'showall') {
              jobsUiState.allRenderLimit = Infinity;
            }
            renderJobsExplorer();
            if (action === 'first' || action === 'prev' || action === 'next' || action === 'last') {
              const wrap = document.getElementById('jobsTableWrap');
              if (wrap) wrap.scrollTop = 0;
            }
          });
        }

        if (tbody) {
          tbody.addEventListener('click', function (e) {
            const retryBtn = e.target.closest('#jobsRetryBtn');
            if (retryBtn) loadAllAuditJobs();
          });
        }
      }

      function syncJobsControlsFromState() {
        const chk = document.getElementById('showAllJobsChk');
        const controls = document.getElementById('jobsControls');
        const searchInput = document.getElementById('jobsSearchInput');
        const searchClear = document.getElementById('jobsSearchClearBtn');
        const userSelect = document.getElementById('jobsUserSelect');
        const familySelect = document.getElementById('jobsFamilySelect');
        const statusSelect = document.getElementById('jobsStatusSelect');
        const originSelect = document.getElementById('jobsOriginSelect');
        const pageSizeSelect = document.getElementById('jobsPageSizeSelect');

        if (chk) chk.checked = Boolean(jobsUiState.showAll);
        if (controls) controls.hidden = !jobsUiState.showAll;
        if (searchInput) searchInput.value = jobsUiState.search || '';
        if (searchClear) searchClear.hidden = !(jobsUiState.search);
        if (userSelect) userSelect.value = jobsUiState.user || '';
        if (familySelect) familySelect.value = jobsUiState.family || '';
        if (statusSelect) statusSelect.value = jobsUiState.status || '';
        if (originSelect) originSelect.value = jobsUiState.origin || '';
        if (pageSizeSelect) pageSizeSelect.value = String(jobsUiState.pageSize);
      }

      function setJobsControlsDisabled(disabled) {
        const ids = [
          'jobsSearchInput',
          'jobsUserSelect',
          'jobsFamilySelect',
          'jobsStatusSelect',
          'jobsOriginSelect',
          'jobsPageSizeSelect',
          'jobsClearFiltersBtn',
          'jobsExportCsvBtn'
        ];
        for (let i = 0; i < ids.length; i++) {
          const el = document.getElementById(ids[i]);
          if (el) el.disabled = Boolean(disabled);
        }
      }

      function syncJobsSectionAfterRender() {
        syncJobsControlsFromState();
        if (!jobsUiState.showAll) {
          renderCompactMode();
          return;
        }
        if (allJobsCache !== null) {
          populateJobsFilterOptions();
          syncJobsControlsFromState();
          setJobsControlsDisabled(false);
          renderJobsExplorer();
        } else {
          loadAllAuditJobs();
        }
      }

      function toggleShowAllJobs(enabled) {
        jobsUiState.showAll = Boolean(enabled);
        jobsUiState.page = 1;
        jobsUiState.allRenderLimit = DEFAULT_ALL_RENDER_LIMIT;
        syncJobsControlsFromState();

        if (!jobsUiState.showAll) {
          renderCompactMode();
          return;
        }

        if (allJobsCache !== null) {
          populateJobsFilterOptions();
          syncJobsControlsFromState();
          setJobsControlsDisabled(false);
          renderJobsExplorer();
        } else {
          loadAllAuditJobs();
        }
      }

      function filterJobsByUser(email) {
        jobsUiState.showAll = true;
        jobsUiState.search = '';
        jobsUiState.user = email;
        jobsUiState.family = '';
        jobsUiState.status = '';
        jobsUiState.origin = '';
        jobsUiState.page = 1;
        jobsUiState.allRenderLimit = DEFAULT_ALL_RENDER_LIMIT;

        syncJobsControlsFromState();
        if (allJobsCache !== null) {
          populateJobsFilterOptions();
          syncJobsControlsFromState();
          setJobsControlsDisabled(false);
          renderJobsExplorer();
        } else {
          loadAllAuditJobs();
        }

        const panel = document.getElementById('jobsPanel');
        if (panel && typeof panel.scrollIntoView === 'function') {
          panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }

      function clearAllJobsFilters() {
        if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
        jobsUiState.search = '';
        jobsUiState.user = '';
        jobsUiState.family = '';
        jobsUiState.status = '';
        jobsUiState.origin = '';
        jobsUiState.page = 1;
        jobsUiState.allRenderLimit = DEFAULT_ALL_RENDER_LIMIT;
        syncJobsControlsFromState();
        if (jobsUiState.showAll && allJobsCache !== null) {
          renderJobsExplorer();
        }
      }

      function renderJobsSkeletonRows(count) {
        const widths = [76, 120, 48, 145, 36, 70, 92, 48, 58];
        const total = typeof count === 'number' && count > 0 ? count : 6;
        let html = '';
        for (let r = 0; r < total; r++) {
          html += '<tr class="skel-tr" aria-hidden="true">';
          for (let c = 0; c < widths.length; c++) {
            const w = widths[c] + ((r % 2 === 1 && c === 3) ? -22 : 0);
            html += '<td><span class="skel-cell" style="width:' + w + 'px"></span></td>';
          }
          html += '</tr>';
        }
        return html;
      }

      function renderCompactMode() {
        const title = document.getElementById('jobsPanelTitle');
        const spinner = document.getElementById('jobsLoadingSpinner');
        const badge = document.getElementById('jobsScopeBadge');
        const controls = document.getElementById('jobsControls');
        const wrap = document.getElementById('jobsTableWrap');
        const tbody = document.getElementById('jobsTableBody');
        const pager = document.getElementById('jobsPagination');

        if (title) title.textContent = 'Actividad reciente (últimos 20 trabajos)';
        if (spinner) spinner.hidden = true;
        if (badge) {
          badge.textContent = '';
          badge.hidden = true;
        }
        if (controls) controls.hidden = true;
        if (wrap) {
          wrap.classList.remove('is-scrollable');
          wrap.setAttribute('aria-busy', 'false');
          wrap.scrollTop = 0;
        }
        if (pager) {
          pager.innerHTML = '';
          pager.hidden = true;
        }
        if (tbody && lastDashboardData) {
          tbody.innerHTML = renderCompactRecentRows(lastDashboardData.recentJobs);
        }
      }

      function loadAllAuditJobs() {
        if (allJobsLoading) return;
        allJobsLoading = true;
        allJobsError = '';

        const title = document.getElementById('jobsPanelTitle');
        const spinner = document.getElementById('jobsLoadingSpinner');
        const badge = document.getElementById('jobsScopeBadge');
        const summary = document.getElementById('jobsFilterSummary');
        const tbody = document.getElementById('jobsTableBody');
        const pager = document.getElementById('jobsPagination');
        const wrap = document.getElementById('jobsTableWrap');

        if (title) title.textContent = 'Todos los trabajos de Auditoría';
        if (spinner) spinner.hidden = false;
        if (badge) {
          badge.textContent = 'Cargando hoja...';
          badge.hidden = false;
        }
        if (summary) summary.textContent = 'Cargando registros completos de Auditoría...';
        if (wrap) {
          wrap.classList.remove('is-scrollable');
          wrap.setAttribute('aria-busy', 'true');
        }
        if (pager) pager.hidden = true;
        if (tbody) {
          tbody.innerHTML = renderJobsSkeletonRows(6);
        }
        setJobsControlsDisabled(true);

        google.script.run
          .withSuccessHandler(function (res) {
            allJobsLoading = false;
            if (!res || !res.success || !res.data) {
              const msg = (res && res.error) || 'No se pudieron cargar todos los trabajos de Auditoría.';
              allJobsError = msg;
              showDashAlert(msg);
              if (jobsUiState.showAll) {
                renderAllJobsLoadError(msg);
              }
              return;
            }
            allJobsCache = prepareJobsCache(res.data.jobs || []);
            if (!jobsUiState.showAll) return;
            populateJobsFilterOptions();
            syncJobsControlsFromState();
            setJobsControlsDisabled(false);
            renderJobsExplorer();
          })
          .withFailureHandler(function (err) {
            allJobsLoading = false;
            const msg = (err && err.message) || 'Error de comunicación al cargar los trabajos.';
            allJobsError = msg;
            showDashAlert(msg);
            if (jobsUiState.showAll) {
              renderAllJobsLoadError(msg);
            }
          })
          .apiGetAuditJobs(DIALOG_TOKEN);
      }

      function renderAllJobsLoadError(msg) {
        const spinner = document.getElementById('jobsLoadingSpinner');
        const badge = document.getElementById('jobsScopeBadge');
        const summary = document.getElementById('jobsFilterSummary');
        const wrap = document.getElementById('jobsTableWrap');
        const tbody = document.getElementById('jobsTableBody');
        const pager = document.getElementById('jobsPagination');
        setJobsControlsDisabled(false);
        const exportBtn = document.getElementById('jobsExportCsvBtn');
        if (exportBtn) exportBtn.disabled = true;
        if (spinner) spinner.hidden = true;
        if (badge) badge.hidden = true;
        if (wrap) wrap.setAttribute('aria-busy', 'false');
        if (summary) summary.textContent = 'Error al cargar el histórico completo.';
        if (pager) pager.hidden = true;
        if (tbody) {
          tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#991b1b;padding:20px;">' +
            escapeHtml(msg) +
            ' <button type="button" id="jobsRetryBtn" class="tool-btn" style="margin-left:8px;">Reintentar</button>' +
            '</td></tr>';
        }
      }

      function populateJobsFilterOptions() {
        const jobs = allJobsCache || [];
        const userCounts = {};
        const familyCounts = {};
        const statusCounts = {};
        const originCounts = {};

        for (let i = 0; i < jobs.length; i++) {
          const j = jobs[i];
          userCounts[j.user] = (userCounts[j.user] || 0) + 1;
          familyCounts[j._familyKey] = (familyCounts[j._familyKey] || 0) + 1;
          statusCounts[j._statusKey] = (statusCounts[j._statusKey] || 0) + 1;
          originCounts[j._originKey] = (originCounts[j._originKey] || 0) + 1;
        }

        if (jobsUiState.user && !Object.prototype.hasOwnProperty.call(userCounts, jobsUiState.user)) {
          userCounts[jobsUiState.user] = 0;
        }

        const userSelect = document.getElementById('jobsUserSelect');
        if (userSelect) {
          const users = Object.keys(userCounts).sort(function (a, b) {
            return a.localeCompare(b, DASH_LOCALE, { sensitivity: 'base' });
          });
          let optHtml = '<option value="">Todos los usuarios (' + formatNum(users.length, 0, 0) + ')</option>';
          for (let i = 0; i < users.length; i++) {
            const u = users[i];
            optHtml += '<option value="' + escapeHtml(u) + '">' + escapeHtml(u) + ' (' + formatNum(userCounts[u], 0, 0) + ')</option>';
          }
          userSelect.innerHTML = optHtml;
        }

        const familySelect = document.getElementById('jobsFamilySelect');
        if (familySelect) {
          let optHtml = '<option value="">Todas las familias</option>';
          for (let i = 0; i < FAMILY_ORDER.length; i++) {
            const key = FAMILY_ORDER[i];
            const cnt = familyCounts[key] || 0;
            if (cnt === 0 && jobsUiState.family !== key) continue;
            const meta = FAMILY_META[key];
            optHtml += '<option value="' + escapeHtml(key) + '">' + escapeHtml(meta.label) + ' (' + formatNum(cnt, 0, 0) + ')</option>';
          }
          familySelect.innerHTML = optHtml;
        }

        const statusSelect = document.getElementById('jobsStatusSelect');
        if (statusSelect) {
          const statusOrder = ['OK', 'RECHAZADO', 'ERROR'];
          let optHtml = '<option value="">Todos los estados</option>';
          for (let i = 0; i < statusOrder.length; i++) {
            const st = statusOrder[i];
            const cnt = statusCounts[st] || 0;
            optHtml += '<option value="' + st + '">' + escapeHtml(STATUS_LABELS[st] || st) + ' (' + formatNum(cnt, 0, 0) + ')</option>';
          }
          statusSelect.innerHTML = optHtml;
        }

        const originSelect = document.getElementById('jobsOriginSelect');
        if (originSelect) {
          const originOrder = ['LOCAL', 'DRIVE'];
          let optHtml = '<option value="">Todos los orígenes</option>';
          for (let i = 0; i < originOrder.length; i++) {
            const org = originOrder[i];
            const cnt = originCounts[org] || 0;
            optHtml += '<option value="' + org + '">' + escapeHtml(ORIGIN_LABELS[org] || org) + ' (' + formatNum(cnt, 0, 0) + ')</option>';
          }
          originSelect.innerHTML = optHtml;
        }
      }

      function getFilteredAuditJobs() {
        const jobs = allJobsCache || [];
        const normSearch = normalizeText(jobsUiState.search).trim();
        const tokens = normSearch ? normSearch.split(/\s+/) : [];
        const userFilter = jobsUiState.user || '';
        const familyFilter = jobsUiState.family || '';
        const statusFilter = jobsUiState.status || '';
        const originFilter = jobsUiState.origin || '';

        if (!tokens.length && !userFilter && !familyFilter && !statusFilter && !originFilter) {
          return jobs;
        }

        const out = [];
        for (let i = 0; i < jobs.length; i++) {
          const j = jobs[i];
          if (userFilter && j.user !== userFilter) continue;
          if (familyFilter && j._familyKey !== familyFilter) continue;
          if (statusFilter && j._statusKey !== statusFilter) continue;
          if (originFilter && j._originKey !== originFilter) continue;

          if (tokens.length > 0) {
            let matchAll = true;
            for (let t = 0; t < tokens.length; t++) {
              if (j._searchBlob.indexOf(tokens[t]) === -1) {
                matchAll = false;
                break;
              }
            }
            if (!matchAll) continue;
          }
          out.push(j);
        }
        return out;
      }

      function renderJobsExplorer() {
        if (!jobsUiState.showAll || allJobsCache === null) return;

        const title = document.getElementById('jobsPanelTitle');
        const spinner = document.getElementById('jobsLoadingSpinner');
        const badge = document.getElementById('jobsScopeBadge');
        const summary = document.getElementById('jobsFilterSummary');
        const clearBtn = document.getElementById('jobsClearFiltersBtn');
        const exportBtn = document.getElementById('jobsExportCsvBtn');
        const wrap = document.getElementById('jobsTableWrap');
        const tbody = document.getElementById('jobsTableBody');
        const pager = document.getElementById('jobsPagination');

        if (spinner) spinner.hidden = true;
        if (wrap) wrap.setAttribute('aria-busy', 'false');

        const totalAll = allJobsCache.length;
        const filtered = getFilteredAuditJobs();
        const totalFiltered = filtered.length;
        const hasFilters = Boolean(
          normalizeText(jobsUiState.search).trim() ||
          jobsUiState.user ||
          jobsUiState.family ||
          jobsUiState.status ||
          jobsUiState.origin
        );

        if (title) title.textContent = 'Todos los trabajos de Auditoría';
        if (badge) {
          badge.textContent = 'Histórico completo de la hoja (' + formatNum(totalAll, 0, 0) + ')';
          badge.hidden = false;
        }
        if (clearBtn) clearBtn.hidden = !hasFilters;
        if (exportBtn) exportBtn.disabled = totalFiltered === 0;

        let visibleRows = [];
        let startIdx = 0;
        let endIdx = 0;
        let totalPages = 1;

        if (totalFiltered > 0) {
          if (jobsUiState.pageSize > 0) {
            totalPages = Math.max(1, Math.ceil(totalFiltered / jobsUiState.pageSize));
            if (jobsUiState.page > totalPages) jobsUiState.page = totalPages;
            if (jobsUiState.page < 1) jobsUiState.page = 1;
            startIdx = (jobsUiState.page - 1) * jobsUiState.pageSize;
            endIdx = Math.min(totalFiltered, startIdx + jobsUiState.pageSize);
            visibleRows = filtered.slice(startIdx, endIdx);
          } else {
            const limit = jobsUiState.allRenderLimit;
            endIdx = Math.min(totalFiltered, limit);
            visibleRows = filtered.slice(0, endIdx);
          }
        }

        if (summary) {
          if (totalFiltered === 0) {
            summary.textContent = 'Sin coincidencias en ' + formatNum(totalAll, 0, 0) + ' trabajos de la hoja.';
          } else if (hasFilters) {
            summary.textContent = 'Mostrando ' + formatNum(startIdx + 1, 0, 0) + '–' + formatNum(endIdx, 0, 0) + ' de ' + formatNum(totalFiltered, 0, 0) + ' resultados filtrados (de ' + formatNum(totalAll, 0, 0) + ' en la hoja)';
          } else {
            summary.textContent = 'Mostrando ' + formatNum(startIdx + 1, 0, 0) + '–' + formatNum(endIdx, 0, 0) + ' de ' + formatNum(totalAll, 0, 0) + ' trabajos en la hoja';
          }
        }

        if (wrap) {
          wrap.classList.toggle('is-scrollable', visibleRows.length > 0);
        }

        if (tbody) {
          if (visibleRows.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#64748b;padding:24px;">No hay trabajos que coincidan con los filtros activos.</td></tr>';
          } else {
            let rowsHtml = '';
            for (let i = 0; i < visibleRows.length; i++) {
              rowsHtml += renderJobRowHtml(visibleRows[i], true);
            }
            tbody.innerHTML = rowsHtml;
          }
        }

        if (pager) {
          if (totalFiltered === 0) {
            pager.innerHTML = '';
            pager.hidden = true;
          } else if (jobsUiState.pageSize > 0) {
            const curPage = jobsUiState.page;
            pager.hidden = false;
            pager.innerHTML =
              '<span>Rango actual: <b>' + formatNum(startIdx + 1, 0, 0) + '–' + formatNum(endIdx, 0, 0) + '</b> de ' + formatNum(totalFiltered, 0, 0) + '</span>' +
              '<div class="pager-controls">' +
                '<button type="button" class="tool-btn" data-action="first"' + (curPage <= 1 ? ' disabled' : '') + '>« Primera</button>' +
                '<button type="button" class="tool-btn" data-action="prev"' + (curPage <= 1 ? ' disabled' : '') + '>‹ Anterior</button>' +
                '<span class="pager-label">Página ' + formatNum(curPage, 0, 0) + ' de ' + formatNum(totalPages, 0, 0) + '</span>' +
                '<button type="button" class="tool-btn" data-action="next" data-total-pages="' + totalPages + '"' + (curPage >= totalPages ? ' disabled' : '') + '>Siguiente ›</button>' +
                '<button type="button" class="tool-btn" data-action="last" data-total-pages="' + totalPages + '"' + (curPage >= totalPages ? ' disabled' : '') + '>Última »</button>' +
              '</div>';
          } else if (totalFiltered > jobsUiState.allRenderLimit) {
            pager.hidden = false;
            pager.innerHTML =
              '<div class="safeguard-bar">' +
                '<span>Mostrando los primeros ' + formatNum(endIdx, 0, 0) + ' de ' + formatNum(totalFiltered, 0, 0) + ' registros para mantener fluida la ventana.</span>' +
                '<div class="safeguard-actions">' +
                  '<button type="button" class="tool-btn" data-action="more500">Cargar ' + formatNum(DEFAULT_ALL_RENDER_LIMIT, 0, 0) + ' más</button>' +
                  '<button type="button" class="tool-btn" data-action="showall">Mostrar todos (' + formatNum(totalFiltered, 0, 0) + ')</button>' +
                '</div>' +
              '</div>';
          } else {
            pager.hidden = false;
            pager.innerHTML = '<span>Mostrando todos los resultados filtrados (' + formatNum(totalFiltered, 0, 0) + ').</span>';
          }
        }
      }

      function escapeCsvCell(value) {
        let s = String(value === null || value === undefined ? '' : value).replace(/\u200B/g, '');
        if (/^[=+\-@\t\r]/.test(s)) {
          s = "'" + s;
        }
        if (/[,"\r\n]/.test(s)) {
          s = '"' + s.replace(/"/g, '""') + '"';
        }
        return s;
      }

      function exportFilteredJobsCsv() {
        try {
          const rows = getFilteredAuditJobs();
          if (!rows.length) {
            showDashAlert('No hay filas filtradas para exportar a CSV.');
            return;
          }
          const headers = [
            'Fecha', 'ID trabajo', 'Usuario', 'Origen', 'Archivo',
            'Extensión', 'Familia', 'Tamaño Entrada (KB)', 'Tamaño PDF (KB)',
            'Duración (ms)', 'Estado', 'Detalle'
          ];
          const lines = [headers.map(escapeCsvCell).join(',')];

          for (let i = 0; i < rows.length; i++) {
            const j = rows[i];
            const famMeta = FAMILY_META[j._familyKey || normalizeJobFamily(j.family)] || FAMILY_META.OTROS;
            lines.push([
              j.timestampFull || j.timestamp || '',
              j.jobId || '',
              j.user || '',
              j.origin || '',
              j.file || '',
              j.ext ? '.' + j.ext : '',
              j.family ? (famMeta.label || j.family) : famMeta.label,
              j.inputKB,
              j.pdfKB,
              j.durationMs,
              j._statusKey || j.status || '',
              j.detail || ''
            ].map(escapeCsvCell).join(','));
          }

          const now = new Date();
          const yyyy = String(now.getFullYear());
          const mm = String(now.getMonth() + 1).padStart(2, '0');
          const dd = String(now.getDate()).padStart(2, '0');
          const filename = 'doc2pdf_auditoria_' + yyyy + '-' + mm + '-' + dd + '.csv';

          const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = filename;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          setTimeout(function () {
            URL.revokeObjectURL(url);
          }, 1500);
        } catch (err) {
          showDashAlert((err && err.message) || 'No se pudo generar el archivo CSV.');
        }
      }

      function attachBarTooltips(series) {
        const svg = document.getElementById('dailyChartSvg');
        const tip = document.getElementById('barTooltip');
        if (!svg || !tip || !series) return;

        const hits = svg.querySelectorAll('.bar-hit');
        for (let i = 0; i < hits.length; i++) {
          hits[i].addEventListener('mouseenter', function (e) {
            const idx = Number(e.target.getAttribute('data-idx'));
            const item = series[idx];
            if (!item) return;
            tip.textContent = item.label + ': ' + formatNum(item.ok, 0, 0) + ' OK · ' + formatNum(item.rejected, 0, 0) + ' rech. · ' + formatNum(item.error, 0, 0) + ' err.';
            tip.classList.add('visible');
          });
          hits[i].addEventListener('mousemove', function (e) {
            const rect = svg.parentElement.getBoundingClientRect();
            tip.style.left = (e.clientX - rect.left) + 'px';
            tip.style.top = (e.clientY - rect.top) + 'px';
          });
          hits[i].addEventListener('mouseleave', function () {
            tip.classList.remove('visible');
          });
        }
      }

      loadAnalytics();
    </script>
  </body>
