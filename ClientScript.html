<script>
(function () {
  'use strict';

  const THEME_STORAGE_KEY = 'doc2pdf-color-scheme';
  const DIRECT_CONCURRENCY = 2;
  const PDFJS_CDN_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  const PDFJS_WORKER_CDN_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const state = {
    config: null,
    jobs: [],
    activeDirect: 0,
    activeChunked: false,
    previewUrl: '',
    currentTab: 'local',
    pdfJsLoadPromise: null,
    pdfWorkerBlobUrl: '',
    preview: {
      doc: null,
      pageNum: 1,
      totalPages: 1,
      scale: 1,
      fitMode: 'width',
      renderTask: null,
      sessionId: 0
    }
  };

  /* -------------------------------------------------------------------------
   * Gestión de tema (dark-mode-toggle según modern-web-guidance)
   * ---------------------------------------------------------------------- */
  function initThemeControls() {
    const meta = document.querySelector('meta[name="color-scheme"]');
    const btn = document.getElementById('themeToggleBtn');
    const darkMq = window.matchMedia('(prefers-color-scheme: dark)');

    function syncAria() {
      const stored = safeGetStorage(THEME_STORAGE_KEY);
      const rendered = stored || (darkMq.matches ? 'dark' : 'light');
      btn.setAttribute('aria-pressed', rendered === 'dark' ? 'true' : 'false');
    }

    btn.addEventListener('click', function () {
      const stored = safeGetStorage(THEME_STORAGE_KEY);
      const systemScheme = darkMq.matches ? 'dark' : 'light';
      const currentRendered = stored || systemScheme;
      const targetScheme = currentRendered === 'dark' ? 'light' : 'dark';

      if (targetScheme === systemScheme) {
        safeRemoveStorage(THEME_STORAGE_KEY);
        meta.content = 'light dark';
      } else {
        safeSetStorage(THEME_STORAGE_KEY, targetScheme);
        meta.content = targetScheme;
      }
      syncAria();
    });

    window.addEventListener('storage', function (ev) {
      if (ev.key === THEME_STORAGE_KEY) {
        meta.content = ev.newValue || 'light dark';
        syncAria();
      }
    });

    darkMq.addEventListener('change', syncAria);
    syncAria();
  }

  function safeGetStorage(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function safeSetStorage(key, val) {
    try { localStorage.setItem(key, val); } catch (e) {}
  }
  function safeRemoveStorage(key) {
    try { localStorage.removeItem(key); } catch (e) {}
  }

  /* -------------------------------------------------------------------------
   * Diálogos nativos <dialog> + fallback light-dismiss Safari
   * ---------------------------------------------------------------------- */
  function initDialogs() {
    const dialogs = document.querySelectorAll('dialog');
    const supportsClosedBy = 'closedBy' in HTMLDialogElement.prototype;

    for (let i = 0; i < dialogs.length; i++) {
      const dlg = dialogs[i];

      dlg.addEventListener('close', function () {
        if (dlg.id === 'previewDialog') {
          destroyPreviewState();
        }
        dlg.returnValue = '';
      });

      if (!supportsClosedBy && dlg.getAttribute('closedby') === 'any') {
        let pressedOutside = false;
        const isOutside = function (ev) {
          const r = dlg.getBoundingClientRect();
          return ev.clientX < r.left || ev.clientX > r.right || ev.clientY < r.top || ev.clientY > r.bottom;
        };
        dlg.addEventListener('pointerdown', function (ev) {
          pressedOutside = isOutside(ev);
        });
        dlg.addEventListener('pointerup', function (ev) {
          if (pressedOutside && isOutside(ev)) {
            dlg.close();
          }
          pressedOutside = false;
        });
      }
    }

    document.getElementById('closePreviewBtn').addEventListener('click', function () {
      document.getElementById('previewDialog').close();
    });
    document.getElementById('closeFormatsBtn').addEventListener('click', function () {
      document.getElementById('formatsDialog').close();
    });
    document.getElementById('openFormatsBtn').addEventListener('click', function () {
      document.getElementById('formatsDialog').showModal();
    });

    const resetPreviewScroll = function () {
      const st = document.getElementById('previewStage');
      if (st) {
        st.scrollTop = 0;
        st.scrollLeft = 0;
      }
    };

    document.getElementById('pdfPrevBtn').addEventListener('click', function () {
      if (state.preview.doc && state.preview.pageNum > 1) {
        state.preview.pageNum -= 1;
        resetPreviewScroll();
        renderCurrentPdfPage();
      }
    });
    document.getElementById('pdfNextBtn').addEventListener('click', function () {
      if (state.preview.doc && state.preview.pageNum < state.preview.totalPages) {
        state.preview.pageNum += 1;
        resetPreviewScroll();
        renderCurrentPdfPage();
      }
    });
    document.getElementById('pdfZoomOutBtn').addEventListener('click', function () {
      if (!state.preview.doc) return;
      state.preview.fitMode = 'manual';
      state.preview.scale = Math.max(0.25, Number((state.preview.scale - 0.2).toFixed(2)));
      renderCurrentPdfPage();
    });
    document.getElementById('pdfZoomFitBtn').addEventListener('click', function () {
      if (!state.preview.doc) return;
      state.preview.fitMode = 'width';
      resetPreviewScroll();
      renderCurrentPdfPage();
    });
    document.getElementById('pdfZoomFitPageBtn').addEventListener('click', function () {
      if (!state.preview.doc) return;
      state.preview.fitMode = 'page';
      resetPreviewScroll();
      renderCurrentPdfPage();
    });
    document.getElementById('pdfZoomInBtn').addEventListener('click', function () {
      if (!state.preview.doc) return;
      state.preview.fitMode = 'manual';
      state.preview.scale = Math.min(3, Number((state.preview.scale + 0.2).toFixed(2)));
      renderCurrentPdfPage();
    });
    document.getElementById('previewDialog').addEventListener('keydown', function (ev) {
      if (!state.preview.doc) return;
      if (ev.key === 'ArrowLeft' && state.preview.pageNum > 1) {
        ev.preventDefault();
        state.preview.pageNum -= 1;
        resetPreviewScroll();
        renderCurrentPdfPage();
      } else if (ev.key === 'ArrowRight' && state.preview.pageNum < state.preview.totalPages) {
        ev.preventDefault();
        state.preview.pageNum += 1;
        resetPreviewScroll();
        renderCurrentPdfPage();
      }
    });

    let previewResizeTimer = null;
    window.addEventListener('resize', function () {
      const dlg = document.getElementById('previewDialog');
      if (!dlg || !dlg.open || !state.preview.doc || state.preview.fitMode === 'manual') return;
      clearTimeout(previewResizeTimer);
      previewResizeTimer = setTimeout(function () {
        if (dlg.open && state.preview.doc && state.preview.fitMode !== 'manual') {
          renderCurrentPdfPage();
        }
      }, 120);
    });
  }

  /* -------------------------------------------------------------------------
   * Utilidades generales
   * ---------------------------------------------------------------------- */
  function runServer(fnName, arg) {
    return new Promise(function (resolve, reject) {
      const runner = google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.success) {
            resolve(res.data);
          } else {
            reject(new Error((res && res.error) || 'Error inesperado del servidor.'));
          }
        })
        .withFailureHandler(function (err) {
          reject(new Error((err && err.message) || 'Error de comunicación con Google Apps Script.'));
        });

      if (typeof arg === 'undefined') {
        runner[fnName]();
      } else {
        runner[fnName](arg);
      }
    });
  }

  function showToast(msg, isError) {
    const region = document.getElementById('toastRegion');
    const el = document.createElement('div');
    el.className = 'toast' + (isError ? ' err' : '');
    el.textContent = msg;
    region.appendChild(el);
    setTimeout(function () {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, 4200);
  }

  function formatLocaleNumber(val, minDec, maxDec) {
    const n = Number(val);
    if (!isFinite(n)) return '0';
    const loc = (state.config && state.config.locale) || 'es-ES';
    const opts = {};
    if (typeof minDec === 'number') opts.minimumFractionDigits = minDec;
    if (typeof maxDec === 'number') opts.maximumFractionDigits = maxDec;
    try {
      return new Intl.NumberFormat(loc, opts).format(n);
    } catch (e) {
      return new Intl.NumberFormat('es-ES', opts).format(n);
    }
  }

  function formatBytes(bytes) {
    if (!bytes || bytes <= 0) return '0 B';
    if (bytes < 1024) return formatLocaleNumber(bytes, 0, 0) + ' B';
    if (bytes < 1024 * 1024) return formatLocaleNumber(bytes / 1024, 1, 1) + ' KB';
    return formatLocaleNumber(bytes / (1024 * 1024), 2, 2) + ' MB';
  }

  function getExt(name) {
    const idx = String(name || '').lastIndexOf('.');
    return idx > 0 && idx < name.length - 1 ? name.slice(idx + 1).toLowerCase() : '';
  }

  function blobToBase64(blob) {
    return new Promise(function (resolve, reject) {
      const reader = new FileReader();
      reader.onload = function () {
        const res = String(reader.result || '');
        const comma = res.indexOf(',');
        resolve(comma !== -1 ? res.slice(comma + 1) : res);
      };
      reader.onerror = function () {
        reject(new Error('No se pudo leer el archivo local.'));
      };
      reader.readAsDataURL(blob);
    });
  }

  function base64ToUint8Array(b64) {
    const bin = atob(b64);
    const len = bin.length;
    const arr = new Uint8Array(len);
    for (let i = 0; i < len; i++) {
      arr[i] = bin.charCodeAt(i);
    }
    return arr;
  }

  function readSheetOptions() {
    return {
      size: document.getElementById('optPaperSize').value,
      portrait: document.getElementById('optOrientation').value === 'portrait',
      scale: document.getElementById('optScale').value,
      margins: document.getElementById('optMargins').value,
      gridlines: document.getElementById('optGridlines').checked
    };
  }

  function triggerBlobDownload(blobUrl, fileName) {
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = fileName || 'documento.pdf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  /* -------------------------------------------------------------------------
   * Empaquetador ZIP nativo sin dependencias externas (PKWARE STORE + UTF-8)
   * ---------------------------------------------------------------------- */
  const CRC32_TABLE = (function () {
    const tbl = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let k = 0; k < 8; k++) {
        c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      }
      tbl[i] = c >>> 0;
    }
    return tbl;
  })();

  function crc32(bytes) {
    let crc = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) {
      crc = (crc >>> 8) ^ CRC32_TABLE[(crc ^ bytes[i]) & 0xFF];
    }
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }

  function encodeUtf8(text) {
    if (typeof TextEncoder !== 'undefined') {
      return new TextEncoder().encode(String(text || ''));
    }
    const str = unescape(encodeURIComponent(String(text || '')));
    const out = new Uint8Array(str.length);
    for (let i = 0; i < str.length; i++) {
      out[i] = str.charCodeAt(i);
    }
    return out;
  }

  function getDosDateTime(dateObj) {
    const d = dateObj || new Date();
    const year = Math.min(2107, Math.max(1980, d.getFullYear()));
    const dosTime = ((d.getHours() & 0x1F) << 11) |
      ((d.getMinutes() & 0x3F) << 5) |
      ((d.getSeconds() >> 1) & 0x1F);
    const dosDate = (((year - 1980) & 0x7F) << 9) |
      (((d.getMonth() + 1) & 0x0F) << 5) |
      (d.getDate() & 0x1F);
    return { dosTime: dosTime, dosDate: dosDate };
  }

  function makeUniqueZipName(rawName, usedNames) {
    const sanitized = String(rawName || 'documento.pdf')
      .replace(/[\\/\x00-\x1F]+/g, '_')
      .trim() || 'documento.pdf';
    let candidate = sanitized;
    const dotIdx = sanitized.lastIndexOf('.');
    const base = dotIdx > 0 ? sanitized.slice(0, dotIdx) : sanitized;
    const ext = dotIdx > 0 ? sanitized.slice(dotIdx) : '';
    let suffix = 2;

    while (usedNames[candidate.toLowerCase()]) {
      candidate = base + ' (' + suffix + ')' + ext;
      suffix += 1;
    }
    usedNames[candidate.toLowerCase()] = true;
    return candidate;
  }

  function buildZipBytes(entries) {
    const parts = [];
    const centralDir = [];
    let offset = 0;
    const dos = getDosDateTime(new Date());

    for (let i = 0; i < entries.length; i++) {
      const entry = entries[i];
      const nameBytes = encodeUtf8(entry.name);
      const dataBytes = entry.bytes instanceof Uint8Array ? entry.bytes : new Uint8Array(entry.bytes);
      const fileCrc = crc32(dataBytes);
      const size = dataBytes.length;

      const localHeader = new Uint8Array(30 + nameBytes.length);
      const lv = new DataView(localHeader.buffer);
      lv.setUint32(0, 0x04034B50, true);
      lv.setUint16(4, 20, true);
      lv.setUint16(6, 0x0800, true);
      lv.setUint16(8, 0, true);
      lv.setUint16(10, dos.dosTime, true);
      lv.setUint16(12, dos.dosDate, true);
      lv.setUint32(14, fileCrc, true);
      lv.setUint32(18, size, true);
      lv.setUint32(22, size, true);
      lv.setUint16(26, nameBytes.length, true);
      lv.setUint16(28, 0, true);
      localHeader.set(nameBytes, 30);

      parts.push(localHeader, dataBytes);

      const cdHeader = new Uint8Array(46 + nameBytes.length);
      const cv = new DataView(cdHeader.buffer);
      cv.setUint32(0, 0x02014B50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, dos.dosTime, true);
      cv.setUint16(14, dos.dosDate, true);
      cv.setUint32(16, fileCrc, true);
      cv.setUint32(20, size, true);
      cv.setUint32(24, size, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint16(30, 0, true);
      cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true);
      cv.setUint16(36, 0, true);
      cv.setUint32(38, 0, true);
      cv.setUint32(42, offset, true);
      cdHeader.set(nameBytes, 46);

      centralDir.push(cdHeader);
      offset += localHeader.length + size;
    }

    let cdSize = 0;
    for (let i = 0; i < centralDir.length; i++) {
      cdSize += centralDir[i].length;
    }

    const eocd = new Uint8Array(22);
    const ev = new DataView(eocd.buffer);
    ev.setUint32(0, 0x06054B50, true);
    ev.setUint16(4, 0, true);
    ev.setUint16(6, 0, true);
    ev.setUint16(8, entries.length, true);
    ev.setUint16(10, entries.length, true);
    ev.setUint32(12, cdSize, true);
    ev.setUint32(16, offset, true);
    ev.setUint16(20, 0, true);

    const totalSize = offset + cdSize + eocd.length;
    const zipBytes = new Uint8Array(totalSize);
    let cursor = 0;
    for (let i = 0; i < parts.length; i++) {
      zipBytes.set(parts[i], cursor);
      cursor += parts[i].length;
    }
    for (let i = 0; i < centralDir.length; i++) {
      zipBytes.set(centralDir[i], cursor);
      cursor += centralDir[i].length;
    }
    zipBytes.set(eocd, cursor);

    return zipBytes;
  }

  function buildZipBlob(entries) {
    return new Blob([buildZipBytes(entries)], { type: 'application/zip' });
  }

  /* -------------------------------------------------------------------------
   * Inicialización y bootstrap desde servidor
   * ---------------------------------------------------------------------- */
  function bootstrap() {
    runServer('apiGetBootstrap')
      .then(function (cfg) {
        state.config = cfg;
        applyConfigToUi(cfg);
      })
      .catch(function (err) {
        document.getElementById('loadingSection').classList.add('hidden');
        document.getElementById('blockedSection').classList.remove('hidden');
        document.getElementById('blockedTitle').textContent = 'No se pudo iniciar la aplicación';
        document.getElementById('blockedMessage').textContent = err.message;
      });
  }

  function applyConfigToUi(cfg) {
    document.documentElement.style.setProperty('--accent', cfg.accentColor || '#1a73e8');
    document.getElementById('appTitleHeading').textContent = cfg.appName;
    document.getElementById('appSubtitle').textContent = cfg.subtitle || '';

    if (cfg.logoUrl) {
      const logo = document.getElementById('brandLogo');
      const svg = document.getElementById('brandSvg');
      logo.onload = function () {
        logo.classList.remove('hidden');
        svg.classList.add('hidden');
      };
      logo.onerror = function () {
        logo.classList.add('hidden');
        svg.classList.remove('hidden');
      };
      logo.src = cfg.logoUrl;
    }

    updateUserBadge(cfg.user);
    renderFormatsInfo(cfg);

    document.getElementById('loadingSection').classList.add('hidden');

    const impBanner = document.getElementById('impersonationBanner');
    if (impBanner) {
      if (cfg.user && cfg.user.isImpersonating) {
        document.getElementById('impersonationBannerText').textContent =
          cfg.user.impersonationBanner || ('Modo simulación activo: ' + cfg.user.email);
        impBanner.classList.remove('hidden');
      } else {
        impBanner.classList.add('hidden');
      }
    }

    if (!cfg.user || !cfg.user.allowed) {
      document.getElementById('blockedSection').classList.remove('hidden');
      document.getElementById('blockedTitle').textContent =
        cfg.user && cfg.user.code === 'MAINTENANCE' ? 'Servicio en mantenimiento' : 'Acceso restringido';
      document.getElementById('blockedMessage').textContent =
        (cfg.user && cfg.user.reason) || cfg.maintenanceMessage;
      return;
    }

    const maintBanner = document.getElementById('maintenanceAdminBanner');
    if (cfg.user.code === 'MAINTENANCE_ADMIN_BYPASS') {
      document.getElementById('maintenanceAdminText').textContent =
        cfg.user.maintenanceBanner || 'Modo mantenimiento activo: solo el equipo administrador puede utilizar la aplicación actualmente.';
      maintBanner.classList.remove('hidden');
    } else {
      maintBanner.classList.add('hidden');
    }

    document.getElementById('workspaceSection').classList.remove('hidden');
    document.getElementById('maxSizeChip').textContent = 'Máx. ' + cfg.maxSizeMB + ' MB/archivo';
    document.getElementById('maxBatchChip').textContent = 'Lote máx. ' + cfg.maxBatchFiles + ' archivos';

    const acceptList = cfg.enabledFormats.map(function (f) { return '.' + f.ext; }).join(',');
    document.getElementById('fileInput').setAttribute('accept', acceptList);

    const chipsEl = document.getElementById('familyChips');
    chipsEl.innerHTML = '';
    for (let i = 0; i < cfg.familiesSummary.length; i++) {
      const fam = cfg.familiesSummary[i];
      const chip = document.createElement('span');
      chip.className = 'fam-chip';
      chip.textContent = fam.label + ' (' + fam.extensions.map(function (e) { return '.' + e; }).join(', ') + ')';
      chipsEl.appendChild(chip);
    }

    if (!cfg.allowDriveLink) {
      document.getElementById('tabDriveBtn').classList.add('hidden');
    }

    const sheetsEnabled = !Array.isArray(cfg.enabledFamilies) || cfg.enabledFamilies.indexOf('HOJAS') !== -1;
    const sheetToggleEl = document.getElementById('sheetLayoutToggle');
    if (sheetToggleEl) {
      sheetToggleEl.classList.toggle('hidden', !sheetsEnabled);
    }
    updateSheetOptionsVisibility();
  }

  function updateUserBadge(user) {
    if (!user) return;
    const pill = document.getElementById('userPill');
    const emailEl = document.getElementById('userEmailText');
    const quotaEl = document.getElementById('quotaBadge');

    const fullEmail = user.identityExposed ? user.email : 'Sesión Workspace';
    emailEl.textContent = fullEmail;
    emailEl.title = user.identityExposed ? user.email : 'Sesión Workspace activa';
    pill.title = emailEl.title;
    if (user.isAdmin) {
      quotaEl.textContent = 'Sin límite (Admin)';
    } else if (user.dailyLimit > 0) {
      const rem = typeof user.remainingToday === 'number' ? user.remainingToday : user.dailyLimit;
      quotaEl.textContent = user.isImpersonating
        ? rem + '/' + user.dailyLimit + ' hoy (simulado)'
        : rem + '/' + user.dailyLimit + ' hoy';
    } else {
      quotaEl.textContent = 'Sin límite diario';
    }
    pill.classList.remove('hidden');
  }

  function decrementQuotaUi() {
    if (!state.config || !state.config.user || !state.config.user.dailyLimit || state.config.user.quotaExempt) return;
    const u = state.config.user;
    if (typeof u.remainingToday === 'number' && u.remainingToday > 0) {
      u.remainingToday -= 1;
      u.dailyUsed += 1;
      updateUserBadge(u);
    }
  }

  function renderFormatsInfo(cfg) {
    const grid = document.getElementById('formatsGrid');
    grid.innerHTML = '';
    for (let i = 0; i < cfg.familiesSummary.length; i++) {
      const fam = cfg.familiesSummary[i];
      const box = document.createElement('div');
      box.className = 'fmt-box';

      const h3 = document.createElement('h3');
      h3.textContent = fam.label;
      box.appendChild(h3);

      const tags = document.createElement('div');
      tags.className = 'ext-tags';
      for (let j = 0; j < fam.extensions.length; j++) {
        const tag = document.createElement('span');
        tag.className = 'ext-tag';
        tag.textContent = '.' + fam.extensions[j];
        tags.appendChild(tag);
      }
      box.appendChild(tags);
      grid.appendChild(box);
    }
  }

  /* -------------------------------------------------------------------------
   * Pestañas y visibilidad del panel de opciones de Hojas de cálculo
   * ---------------------------------------------------------------------- */
  function initWorkspaceControls() {
    const tabLocal = document.getElementById('tabLocalBtn');
    const tabDrive = document.getElementById('tabDriveBtn');
    const panelLocal = document.getElementById('panelLocal');
    const panelDrive = document.getElementById('panelDrive');

    function switchTab(tabName) {
      state.currentTab = tabName;
      const isLocal = tabName === 'local';
      tabLocal.setAttribute('aria-selected', isLocal ? 'true' : 'false');
      tabDrive.setAttribute('aria-selected', isLocal ? 'false' : 'true');
      panelLocal.classList.toggle('hidden', !isLocal);
      panelDrive.classList.toggle('hidden', isLocal);
      updateSheetOptionsVisibility();
    }

    tabLocal.addEventListener('click', function () { switchTab('local'); });
    tabDrive.addEventListener('click', function () { switchTab('drive'); });

    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');

    dropzone.addEventListener('click', function () { fileInput.click(); });
    dropzone.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ') {
        ev.preventDefault();
        fileInput.click();
      }
    });

    fileInput.addEventListener('change', function (ev) {
      if (ev.target.files && ev.target.files.length > 0) {
        enqueueLocalFiles(ev.target.files);
        fileInput.value = '';
      }
    });

    dropzone.addEventListener('dragover', function (ev) {
      ev.preventDefault();
      dropzone.classList.add('drag-over');
    });
    dropzone.addEventListener('dragleave', function () {
      dropzone.classList.remove('drag-over');
    });
    dropzone.addEventListener('drop', function (ev) {
      ev.preventDefault();
      dropzone.classList.remove('drag-over');
      if (ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files.length > 0) {
        enqueueLocalFiles(ev.dataTransfer.files);
      }
    });

    const driveInput = document.getElementById('driveUrlInput');
    const sheetLayoutChk = document.getElementById('sheetLayoutChk');
    driveInput.addEventListener('input', function () {
      if (driveInput.value.indexOf('/spreadsheets/') !== -1 && sheetLayoutChk) {
        sheetLayoutChk.checked = true;
      }
      updateSheetOptionsVisibility();
    });
    if (sheetLayoutChk) {
      sheetLayoutChk.addEventListener('change', updateSheetOptionsVisibility);
    }

    document.getElementById('driveUrlForm').addEventListener('submit', function (ev) {
      ev.preventDefault();
      enqueueDriveUrlJob(driveInput.value.trim());
    });

    document.getElementById('downloadZipBtn').addEventListener('click', downloadAllAsZip);
    document.getElementById('downloadAllBtn').addEventListener('click', downloadAllCompleted);
    document.getElementById('clearQueueBtn').addEventListener('click', clearAllJobs);
  }

  function updateSheetOptionsVisibility() {
    const sheetsEnabled = !state.config || !Array.isArray(state.config.enabledFamilies) || state.config.enabledFamilies.indexOf('HOJAS') !== -1;
    const panel = document.getElementById('sheetOptionsPanel');
    const sheetChk = document.getElementById('sheetLayoutChk');
    if (!sheetsEnabled) {
      panel.classList.add('hidden');
      return;
    }
    panel.classList.toggle('hidden', !(sheetChk && sheetChk.checked));
  }

  /* -------------------------------------------------------------------------
   * Gestión de cola y ejecución de conversiones
   * ---------------------------------------------------------------------- */
  function findFormatInConfig(ext) {
    if (!state.config || !state.config.enabledFormats) return null;
    for (let i = 0; i < state.config.enabledFormats.length; i++) {
      if (state.config.enabledFormats[i].ext === ext) {
        return state.config.enabledFormats[i];
      }
    }
    return null;
  }

  function enqueueLocalFiles(fileList) {
    const cfg = state.config;
    if (!cfg) return;

    const files = Array.prototype.slice.call(fileList);
    if (files.length > cfg.maxBatchFiles) {
      showToast('Solo se procesarán los primeros ' + cfg.maxBatchFiles + ' archivos por lote.', true);
    }
    const batch = files.slice(0, cfg.maxBatchFiles);
    let hasQueuedSheet = false;

    for (let i = 0; i < batch.length; i++) {
      const file = batch[i];
      const ext = getExt(file.name);
      const fmt = findFormatInConfig(ext);
      const jobId = 'ui_' + Date.now() + '_' + Math.random().toString(16).slice(2, 7);

      const job = {
        id: jobId,
        type: 'local',
        file: file,
        fileName: file.name,
        ext: ext || '?',
        family: fmt ? fmt.family : 'DEFAULT',
        inputSizeBytes: file.size,
        status: 'queued',
        stageText: 'En cola...',
        progressPct: 0,
        indeterminate: false,
        pdfUrl: '',
        pdfFileName: '',
        pdfSizeBytes: 0,
        durationMs: 0,
        errorText: ''
      };

      if (!fmt) {
        job.status = 'error';
        job.stageText = 'Formato no compatible o deshabilitado';
        job.errorText = 'La extensión .' + job.ext + ' no está habilitada.';
      } else if (file.size === 0) {
        job.status = 'error';
        job.stageText = 'Archivo vacío (0 B)';
        job.errorText = 'El archivo no contiene datos.';
      } else if (file.size > cfg.maxSizeBytes) {
        job.status = 'error';
        job.stageText = 'Supera el límite de ' + cfg.maxSizeMB + ' MB';
        job.errorText = 'Peso: ' + formatBytes(file.size) + '.';
      }

      if (job.status === 'queued' && job.family === 'HOJAS') {
        hasQueuedSheet = true;
      }
      state.jobs.unshift(job);
    }

    if (hasQueuedSheet) {
      const sheetChk = document.getElementById('sheetLayoutChk');
      if (sheetChk) sheetChk.checked = true;
    }
    renderQueue();
    updateSheetOptionsVisibility();
    processQueue();
  }

  function enqueueDriveUrlJob(url) {
    if (!url) {
      showToast('Introduce un enlace o ID de Google Drive válido.', true);
      return;
    }
    const sheetChk = document.getElementById('sheetLayoutChk');
    const isLikelySheet = url.indexOf('/spreadsheets/') !== -1 || Boolean(sheetChk && sheetChk.checked);
    const job = {
      id: 'ui_' + Date.now() + '_' + Math.random().toString(16).slice(2, 7),
      type: 'drive',
      driveUrl: url,
      fileName: url,
      ext: isLikelySheet ? 'sheet' : 'drive',
      family: isLikelySheet ? 'HOJAS' : 'DOCUMENTOS',
      inputSizeBytes: 0,
      status: 'queued',
      stageText: 'En cola para lectura desde Drive...',
      progressPct: 0,
      indeterminate: true,
      pdfUrl: '',
      pdfFileName: '',
      pdfSizeBytes: 0,
      durationMs: 0,
      errorText: ''
    };
    state.jobs.unshift(job);
    document.getElementById('driveUrlInput').value = '';
    renderQueue();
    processQueue();
  }

  function processQueue() {
    if (!state.config) return;
    const threshold = state.config.directUploadMaxBytes;

    for (let i = state.jobs.length - 1; i >= 0; i--) {
      const job = state.jobs[i];
      if (job.status !== 'queued') continue;

      const isChunked = job.type === 'local' && job.inputSizeBytes > threshold;
      if (isChunked) {
        if (state.activeChunked) continue;
        state.activeChunked = true;
        runChunkedLocalJob(job).finally(function () {
          state.activeChunked = false;
          processQueue();
        });
      } else {
        if (state.activeDirect >= DIRECT_CONCURRENCY) continue;
        state.activeDirect++;
        const runner = job.type === 'drive' ? runDriveUrlJob(job) : runDirectLocalJob(job);
        runner.finally(function () {
          state.activeDirect--;
          processQueue();
        });
      }
    }
  }

  function runDirectLocalJob(job) {
    job.status = 'working';
    job.indeterminate = true;
    job.stageText = 'Leyendo archivo y enviando a Workspace...';
    renderQueue();

    return blobToBase64(job.file)
      .then(function (b64) {
        job.stageText = 'Convirtiendo documento a PDF...';
        renderQueue();
        return runServer('apiConvertLocalDirect', {
          fileName: job.fileName,
          base64Data: b64,
          sheetOptions: job.family === 'HOJAS' ? readSheetOptions() : null
        });
      })
      .then(function (res) {
        return handleConversionTransfer(job, res);
      })
      .catch(function (err) {
        markJobError(job, err);
      });
  }

  function runChunkedLocalJob(job) {
    job.status = 'working';
    job.indeterminate = false;
    job.progressPct = 4;
    job.stageText = 'Iniciando subida fragmentada...';
    renderQueue();

    let uploadId = '';
    const sheetOptions = job.family === 'HOJAS' ? readSheetOptions() : null;

    return runServer('apiInitChunkedUpload', {
      fileName: job.fileName,
      totalBytes: job.inputSizeBytes,
      sheetOptions: sheetOptions
    })
      .then(function (initRes) {
        uploadId = initRes.uploadId;
        const chunkSize = initRes.chunkSizeBytes || state.config.chunkSizeBytes;
        const totalChunks = Math.ceil(job.inputSizeBytes / chunkSize);

        let chain = Promise.resolve();
        for (let idx = 0; idx < totalChunks; idx++) {
          (function (chunkIdx) {
            chain = chain.then(function () {
              const start = chunkIdx * chunkSize;
              const end = Math.min(job.inputSizeBytes, start + chunkSize);
              const sliceBlob = job.file.slice(start, end);
              return blobToBase64(sliceBlob).then(function (b64Chunk) {
                return runServer('apiUploadChunk', {
                  uploadId: uploadId,
                  start: start,
                  base64Chunk: b64Chunk
                }).then(function () {
                  job.progressPct = Math.round(((chunkIdx + 1) / totalChunks) * 78);
                  job.stageText = 'Subiendo bloque ' + (chunkIdx + 1) + ' de ' + totalChunks + '...';
                  renderQueue();
                });
              });
            });
          })(idx);
        }
        return chain;
      })
      .then(function () {
        job.indeterminate = true;
        job.progressPct = 85;
        job.stageText = 'Generando PDF en Google Workspace...';
        renderQueue();
        return runServer('apiFinalizeChunkedUpload', { uploadId: uploadId });
      })
      .then(function (res) {
        return handleConversionTransfer(job, res);
      })
      .catch(function (err) {
        if (uploadId) {
          runServer('apiAbortChunkedUpload', { uploadId: uploadId }).catch(function () {});
        }
        markJobError(job, err);
      });
  }

  function runDriveUrlJob(job) {
    job.status = 'working';
    job.indeterminate = true;
    job.stageText = 'Leyendo documento desde Google Drive...';
    renderQueue();

    const sheetChk = document.getElementById('sheetLayoutChk');
    const useSheetOpts = Boolean(sheetChk && sheetChk.checked) || job.family === 'HOJAS' || job.driveUrl.indexOf('/spreadsheets/') !== -1;
    return runServer('apiConvertDriveUrl', {
      url: job.driveUrl,
      sheetOptions: useSheetOpts ? readSheetOptions() : null
    })
      .then(function (res) {
        if (res.sourceName) job.fileName = res.sourceName;
        if (res.ext) job.ext = res.ext;
        if (res.family) job.family = res.family;
        if (res.inputSizeBytes) job.inputSizeBytes = res.inputSizeBytes;
        return handleConversionTransfer(job, res);
      })
      .catch(function (err) {
        markJobError(job, err);
      });
  }

  function handleConversionTransfer(job, res) {
    if (res.transferMode === 'direct') {
      const bytes = base64ToUint8Array(res.pdfBase64);
      const pdfBlob = new Blob([bytes], { type: 'application/pdf' });
      return finalizeJobSuccess(job, pdfBlob, res);
    }

    job.indeterminate = false;
    job.progressPct = 88;
    job.stageText = 'Descargando PDF grande (0%)...';
    renderQueue();

    const parts = [];
    let chain = Promise.resolve();
    for (let i = 0; i < res.totalChunks; i++) {
      (function (chunkIdx) {
        chain = chain.then(function () {
          return runServer('apiFetchPdfChunk', {
            downloadToken: res.downloadToken,
            chunkIndex: chunkIdx
          }).then(function (chunkData) {
            parts.push(base64ToUint8Array(chunkData.chunkBase64));
            const pct = 88 + Math.round(((chunkIdx + 1) / res.totalChunks) * 12);
            job.progressPct = Math.min(99, pct);
            job.stageText = 'Descargando bloque PDF ' + (chunkIdx + 1) + '/' + res.totalChunks + '...';
            renderQueue();
          });
        });
      })(i);
    }

    return chain
      .then(function () {
        const pdfBlob = new Blob(parts, { type: 'application/pdf' });
        return runServer('apiCompletePdfDownload', { downloadToken: res.downloadToken })
          .catch(function () {})
          .then(function () {
            return finalizeJobSuccess(job, pdfBlob, res);
          });
      })
      .catch(function (err) {
        runServer('apiCompletePdfDownload', { downloadToken: res.downloadToken }).catch(function () {});
        throw err;
      });
  }

  function finalizeJobSuccess(job, pdfBlob, res) {
    if (job.pdfUrl) {
      URL.revokeObjectURL(job.pdfUrl);
    }
    job.pdfBlob = pdfBlob;
    job.pdfUrl = URL.createObjectURL(pdfBlob);
    job.pdfFileName = res.pdfFileName || 'documento.pdf';
    job.pdfSizeBytes = res.pdfSizeBytes || pdfBlob.size;
    job.durationMs = res.durationMs || 0;
    job.status = 'done';
    job.indeterminate = false;
    job.progressPct = 100;
    job.stageText = 'PDF listo';

    if (job.family === 'HOJAS') {
      const sheetChk = document.getElementById('sheetLayoutChk');
      if (sheetChk) sheetChk.checked = true;
    }
    decrementQuotaUi();
    renderQueue();
    updateSheetOptionsVisibility();
  }

  function markJobError(job, err) {
    job.status = 'error';
    job.indeterminate = false;
    job.progressPct = 0;
    job.errorText = err.message || 'Error en la conversión';
    job.stageText = 'Error en la conversión';
    renderQueue();
    showToast(job.fileName + ': ' + job.errorText, true);
  }

  function retryJob(jobId) {
    const job = findJob(jobId);
    if (!job || job.status === 'working') return;
    if (job.pdfUrl) {
      URL.revokeObjectURL(job.pdfUrl);
      job.pdfUrl = '';
    }
    job.pdfBlob = null;
    job.status = 'queued';
    job.errorText = '';
    job.progressPct = 0;
    job.stageText = 'En cola para reconversión...';
    renderQueue();
    processQueue();
  }

  function findJob(jobId) {
    for (let i = 0; i < state.jobs.length; i++) {
      if (state.jobs[i].id === jobId) return state.jobs[i];
    }
    return null;
  }

  /* -------------------------------------------------------------------------
   * Visor PDF embebido opcional (PDF.js cargado bajo demanda con Blob worker)
   * ---------------------------------------------------------------------- */
  function setPreviewStatus(message, isError) {
    const statusEl = document.getElementById('previewStatus');
    const canvas = document.getElementById('previewCanvas');
    if (!statusEl || !canvas) return;
    if (message) {
      statusEl.textContent = message;
      statusEl.className = 'preview-status' + (isError ? ' err' : '');
      statusEl.classList.remove('hidden');
      canvas.classList.add('hidden');
    } else {
      statusEl.classList.add('hidden');
      statusEl.textContent = '';
      canvas.classList.remove('hidden');
    }
  }

  function updatePreviewControls() {
    const p = state.preview;
    const hasDoc = Boolean(p.doc);
    const isMultiPage = hasDoc && p.totalPages > 1;
    const prevBtn = document.getElementById('pdfPrevBtn');
    const nextBtn = document.getElementById('pdfNextBtn');
    const fitWidthBtn = document.getElementById('pdfZoomFitBtn');
    const fitPageBtn = document.getElementById('pdfZoomFitPageBtn');

    document.getElementById('pdfPageInfo').textContent = hasDoc
      ? 'Página ' + p.pageNum + ' / ' + p.totalPages
      : 'Página —';

    prevBtn.classList.toggle('hidden', !isMultiPage);
    nextBtn.classList.toggle('hidden', !isMultiPage);
    prevBtn.disabled = !isMultiPage || p.pageNum <= 1;
    nextBtn.disabled = !isMultiPage || p.pageNum >= p.totalPages;

    document.getElementById('pdfZoomOutBtn').disabled = !hasDoc;
    fitWidthBtn.disabled = !hasDoc;
    if (fitPageBtn) fitPageBtn.disabled = !hasDoc;
    document.getElementById('pdfZoomInBtn').disabled = !hasDoc;

    fitWidthBtn.setAttribute('aria-pressed', hasDoc && p.fitMode === 'width' ? 'true' : 'false');
    if (fitPageBtn) {
      fitPageBtn.setAttribute('aria-pressed', hasDoc && p.fitMode === 'page' ? 'true' : 'false');
    }
  }

  function destroyPreviewState() {
    state.preview.sessionId += 1;
    if (state.preview.renderTask) {
      try { state.preview.renderTask.cancel(); } catch (e) {}
      state.preview.renderTask = null;
    }
    if (state.preview.doc) {
      try { state.preview.doc.destroy(); } catch (e) {}
      state.preview.doc = null;
    }
    state.preview.pageNum = 1;
    state.preview.totalPages = 1;
    state.preview.scale = 1;
    state.preview.fitMode = 'width';

    const canvas = document.getElementById('previewCanvas');
    if (canvas) {
      canvas.width = 0;
      canvas.height = 0;
    }
    setPreviewStatus('', false);
    updatePreviewControls();
  }

  function ensurePdfJsLoaded() {
    if (window.pdfjsLib && state.pdfWorkerBlobUrl) {
      return Promise.resolve(window.pdfjsLib);
    }
    if (state.pdfJsLoadPromise) {
      return state.pdfJsLoadPromise;
    }

    state.pdfJsLoadPromise = new Promise(function (resolve, reject) {
      const finishInit = function () {
        if (!window.pdfjsLib) {
          reject(new Error('No se pudo inicializar el motor PDF.js.'));
          return;
        }
        if (state.pdfWorkerBlobUrl) {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = state.pdfWorkerBlobUrl;
          resolve(window.pdfjsLib);
          return;
        }
        fetch(PDFJS_WORKER_CDN_URL, { mode: 'cors' })
          .then(function (resp) {
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            return resp.text();
          })
          .then(function (workerCode) {
            const workerBlob = new Blob([workerCode], { type: 'application/javascript' });
            state.pdfWorkerBlobUrl = URL.createObjectURL(workerBlob);
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = state.pdfWorkerBlobUrl;
            resolve(window.pdfjsLib);
          })
          .catch(function () {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER_CDN_URL;
            resolve(window.pdfjsLib);
          });
      };

      if (window.pdfjsLib) {
        finishInit();
        return;
      }

      const script = document.createElement('script');
      script.src = PDFJS_CDN_URL;
      script.async = true;
      script.crossOrigin = 'anonymous';
      script.referrerPolicy = 'no-referrer';
      script.onload = finishInit;
      script.onerror = function () {
        reject(new Error('No se pudo cargar el visor PDF desde la red (CDN bloqueado o sin conexión).'));
      };
      document.head.appendChild(script);
    }).catch(function (err) {
      state.pdfJsLoadPromise = null;
      throw err;
    });

    return state.pdfJsLoadPromise;
  }

  function computePreviewScale(baseViewport, stage, fitMode, currentScale) {
    if (fitMode === 'manual') {
      return currentScale || 1;
    }
    const clientW = (stage && stage.clientWidth) ? stage.clientWidth : 800;
    const clientH = (stage && stage.clientHeight) ? stage.clientHeight : 520;
    let padX = 28;
    let padY = 28;
    if (stage && typeof window !== 'undefined' && typeof window.getComputedStyle === 'function') {
      const cs = window.getComputedStyle(stage);
      padX = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
      padY = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
    }
    const innerW = Math.max(200, Math.floor(clientW - padX) - 2);
    const innerH = Math.max(200, Math.floor(clientH - padY) - 2);

    if (fitMode === 'page') {
      const scaleW = innerW / baseViewport.width;
      const scaleH = innerH / baseViewport.height;
      return Math.min(3, Math.max(0.15, Math.min(scaleW, scaleH)));
    }

    let availW = innerW;
    let scaleW = availW / baseViewport.width;
    const supportsGutter = typeof CSS !== 'undefined' && typeof CSS.supports === 'function' && CSS.supports('scrollbar-gutter', 'stable');
    if (!supportsGutter && (baseViewport.height * scaleW) > innerH) {
      availW = Math.max(200, innerW - 18);
      scaleW = availW / baseViewport.width;
    }
    return Math.min(3, Math.max(0.15, scaleW));
  }

  function renderCurrentPdfPage() {
    const p = state.preview;
    if (!p.doc) return;

    const mySession = p.sessionId;
    if (p.renderTask) {
      try { p.renderTask.cancel(); } catch (e) {}
      p.renderTask = null;
    }

    updatePreviewControls();
    p.doc.getPage(p.pageNum).then(function (page) {
      if (mySession !== state.preview.sessionId) return;

      const stage = document.getElementById('previewStage');
      const canvas = document.getElementById('previewCanvas');
      const baseViewport = page.getViewport({ scale: 1 });
      if (canvas && (p.fitMode === 'width' || p.fitMode === 'page')) {
        canvas.style.width = '0px';
        canvas.style.height = '0px';
      }

      const targetScale = computePreviewScale(baseViewport, stage, p.fitMode, p.scale);
      if (p.fitMode !== 'manual') {
        p.scale = Number(targetScale.toFixed(2));
      }

      const viewport = page.getViewport({ scale: targetScale });
      const cssW = Math.floor(viewport.width);
      const cssH = Math.floor(viewport.height);
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = Math.max(1, Math.floor(cssW * dpr));
      canvas.height = Math.max(1, Math.floor(cssH * dpr));
      canvas.style.width = cssW + 'px';
      canvas.style.height = cssH + 'px';

      setPreviewStatus('', false);

      const ctx = canvas.getContext('2d');
      const renderCtx = {
        canvasContext: ctx,
        viewport: viewport,
        transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null
      };

      const task = page.render(renderCtx);
      p.renderTask = task;
      return task.promise.then(function () {
        if (mySession === state.preview.sessionId) {
          p.renderTask = null;
          updatePreviewControls();
        }
      });
    }).catch(function (err) {
      if (err && err.name === 'RenderingCancelledException') return;
      if (mySession !== state.preview.sessionId) return;
      setPreviewStatus('No se pudo renderizar esta página. Usa «Abrir en pestaña» o «Descargar PDF».', true);
    });
  }

  function openPreview(jobId) {
    const job = findJob(jobId);
    if (!job || !job.pdfUrl || !job.pdfBlob) return;

    destroyPreviewState();
    const mySession = state.preview.sessionId;

    document.getElementById('previewTitle').textContent = job.pdfFileName;

    const dlLink = document.getElementById('previewDownloadLink');
    dlLink.href = job.pdfUrl;
    dlLink.download = job.pdfFileName;

    const tabLink = document.getElementById('previewNewTabLink');
    tabLink.href = job.pdfUrl;

    setPreviewStatus('Cargando vista previa PDF...', false);
    document.getElementById('previewDialog').showModal();

    Promise.all([ensurePdfJsLoaded(), job.pdfBlob.arrayBuffer()])
      .then(function (results) {
        if (mySession !== state.preview.sessionId) return;
        const pdfjsLib = results[0];
        const pdfBytes = new Uint8Array(results[1]);
        return pdfjsLib.getDocument({ data: pdfBytes }).promise;
      })
      .then(function (pdfDoc) {
        if (!pdfDoc || mySession !== state.preview.sessionId) {
          if (pdfDoc) try { pdfDoc.destroy(); } catch (e) {}
          return;
        }
        state.preview.doc = pdfDoc;
        state.preview.totalPages = pdfDoc.numPages || 1;
        state.preview.pageNum = 1;
        state.preview.fitMode = 'width';
        renderCurrentPdfPage();
      })
      .catch(function (err) {
        if (mySession !== state.preview.sessionId) return;
        const msg = (err && err.message) || 'Error al abrir la vista previa.';
        setPreviewStatus(msg + ' Puedes usar «Abrir en pestaña» o «Descargar PDF» abajo.', true);
      });
  }

  function downloadAllAsZip() {
    const doneJobs = state.jobs.filter(function (j) { return j.status === 'done' && j.pdfBlob; });
    if (doneJobs.length === 0) return;

    const btn = document.getElementById('downloadZipBtn');
    const prevText = btn ? btn.textContent : 'Descargar ZIP';
    if (btn) {
      btn.disabled = true;
      btn.textContent = 'Empaquetando ZIP...';
    }

    const usedNames = Object.create(null);
    Promise.all(doneJobs.map(function (job) {
      return job.pdfBlob.arrayBuffer().then(function (buf) {
        return {
          name: makeUniqueZipName(job.pdfFileName, usedNames),
          bytes: new Uint8Array(buf)
        };
      });
    }))
      .then(function (entries) {
        const zipBlob = buildZipBlob(entries);
        const zipUrl = URL.createObjectURL(zipBlob);
        const now = new Date();
        const pad = function (n) { return String(n).padStart(2, '0'); };
        const stamp = now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) +
          '-' + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
        const zipName = 'Doc2PDF_' + stamp + '.zip';

        triggerBlobDownload(zipUrl, zipName);
        showToast('Descargando ' + zipName + ' (' + entries.length + ' PDF).');
        setTimeout(function () { URL.revokeObjectURL(zipUrl); }, 60000);
      })
      .catch(function () {
        showToast('No se pudo generar el archivo ZIP.', true);
      })
      .then(function () {
        if (btn) {
          btn.disabled = false;
          btn.textContent = prevText;
        }
      });
  }

  function downloadAllCompleted() {
    const doneJobs = state.jobs.filter(function (j) { return j.status === 'done' && j.pdfUrl; });
    for (let i = 0; i < doneJobs.length; i++) {
      (function (job, delay) {
        setTimeout(function () {
          triggerBlobDownload(job.pdfUrl, job.pdfFileName);
        }, delay);
      })(doneJobs[i], i * 250);
    }
  }

  function clearAllJobs() {
    const active = state.jobs.some(function (j) { return j.status === 'working' || j.status === 'queued'; });
    if (active) {
      showToast('Espera a que terminen los trabajos en curso antes de limpiar.', true);
      return;
    }
    for (let i = 0; i < state.jobs.length; i++) {
      if (state.jobs[i].pdfUrl) {
        URL.revokeObjectURL(state.jobs[i].pdfUrl);
      }
      state.jobs[i].pdfBlob = null;
    }
    state.jobs = [];
    renderQueue();
    updateSheetOptionsVisibility();
  }

  function renderQueue() {
    const section = document.getElementById('queueSection');
    const listEl = document.getElementById('queueList');
    const titleEl = document.getElementById('queueTitle');
    const downloadZipBtn = document.getElementById('downloadZipBtn');
    const downloadAllBtn = document.getElementById('downloadAllBtn');

    if (state.jobs.length === 0) {
      section.classList.add('hidden');
      listEl.innerHTML = '';
      return;
    }

    section.classList.remove('hidden');
    const doneCount = state.jobs.filter(function (j) { return j.status === 'done'; }).length;
    titleEl.textContent = 'Trabajos (' + doneCount + '/' + state.jobs.length + ' completados)';
    downloadZipBtn.classList.toggle('hidden', doneCount < 2);
    downloadAllBtn.classList.toggle('hidden', doneCount < 2);

    listEl.innerHTML = '';
    for (let i = 0; i < state.jobs.length; i++) {
      const job = state.jobs[i];
      const card = document.createElement('article');
      card.className = 'job-card';

      const icon = document.createElement('div');
      icon.className = 'job-icon fam-' + job.family;
      icon.textContent = (job.ext || 'doc').slice(0, 5);
      card.appendChild(icon);

      const main = document.createElement('div');
      main.className = 'job-main';

      const nameRow = document.createElement('div');
      nameRow.className = 'job-name-row';

      const nameEl = document.createElement('span');
      nameEl.className = 'job-name';
      nameEl.textContent = job.status === 'done' ? job.pdfFileName : job.fileName;
      nameEl.title = job.fileName;
      nameRow.appendChild(nameEl);

      const badge = document.createElement('span');
      const badgeClass = job.status === 'done' ? 'badge-done'
        : job.status === 'error' ? 'badge-error'
        : job.status === 'working' ? 'badge-working'
        : 'badge-queued';
      badge.className = 'job-badge ' + badgeClass;
      badge.textContent = job.status === 'done' ? 'Listo'
        : job.status === 'error' ? 'Error'
        : job.status === 'working' ? 'Procesando'
        : 'En cola';
      nameRow.appendChild(badge);
      main.appendChild(nameRow);

      const meta = document.createElement('div');
      meta.className = 'job-meta';
      if (job.status === 'done') {
        const sizeDiff = job.inputSizeBytes > 0
          ? formatBytes(job.inputSizeBytes) + ' → ' + formatBytes(job.pdfSizeBytes)
          : formatBytes(job.pdfSizeBytes);
        const durSec = job.durationMs ? ' · ' + formatLocaleNumber(job.durationMs / 1000, 1, 1) + ' s' : '';
        meta.textContent = sizeDiff + durSec;
      } else if (job.status === 'error') {
        meta.textContent = job.errorText || job.stageText;
      } else {
        meta.textContent = job.stageText + (job.inputSizeBytes > 0 ? ' (' + formatBytes(job.inputSizeBytes) + ')' : '');
      }
      main.appendChild(meta);

      if (job.status === 'working') {
        const track = document.createElement('div');
        track.className = 'progress-track';
        const fill = document.createElement('div');
        fill.className = 'progress-fill' + (job.indeterminate ? ' indeterminate' : '');
        if (!job.indeterminate) {
          fill.style.width = job.progressPct + '%';
        }
        track.appendChild(fill);
        main.appendChild(track);
      }

      card.appendChild(main);

      const btns = document.createElement('div');
      btns.className = 'job-buttons';

      if (job.status === 'done' && job.pdfUrl) {
        if (state.config && state.config.embeddedPdfViewer) {
          const prevBtn = document.createElement('button');
          prevBtn.type = 'button';
          prevBtn.className = 'btn-sm';
          prevBtn.textContent = 'Vista previa';
          prevBtn.addEventListener('click', function () { openPreview(job.id); });
          btns.appendChild(prevBtn);
        } else {
          const openTabA = document.createElement('a');
          openTabA.className = 'btn-sm';
          openTabA.href = job.pdfUrl;
          openTabA.target = '_blank';
          openTabA.rel = 'noopener';
          openTabA.textContent = 'Abrir PDF';
          btns.appendChild(openTabA);
        }

        if (job.family === 'HOJAS') {
          const reconvBtn = document.createElement('button');
          reconvBtn.type = 'button';
          reconvBtn.className = 'btn-sm';
          reconvBtn.textContent = 'Reconvertir';
          reconvBtn.addEventListener('click', function () { retryJob(job.id); });
          btns.appendChild(reconvBtn);
        }

        const dlA = document.createElement('a');
        dlA.className = 'btn-sm primary';
        dlA.href = job.pdfUrl;
        dlA.download = job.pdfFileName;
        dlA.textContent = 'Descargar';
        btns.appendChild(dlA);
      } else if (job.status === 'error' && (job.file || job.driveUrl)) {
        const retryBtn = document.createElement('button');
        retryBtn.type = 'button';
        retryBtn.className = 'btn-sm';
        retryBtn.textContent = 'Reintentar';
        retryBtn.addEventListener('click', function () { retryJob(job.id); });
        btns.appendChild(retryBtn);
      }

      card.appendChild(btns);
      listEl.appendChild(card);
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    initThemeControls();
    initDialogs();
    initWorkspaceControls();
    bootstrap();
  });
})();
</script>
