<style>
  :root {
    --accent: #1a73e8;
    --bg: #f8fafc;
    --surface: #ffffff;
    --surface-alt: #f1f5f9;
    --text: #0f172a;
    --muted: #475569;
    --border: #e2e8f0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    line-height: 1.45;
  }
  .hdr {
    flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent) 0%, #0f2b5b 100%);
    color: #ffffff;
    padding: 14px 22px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .hdr h1 {
    margin: 0;
    font-size: 16.5px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .body {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
  }
  .kpi-row-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi-row-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .kpi-row-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 10px;
    text-align: center;
  }
  .kpi-val {
    display: block;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.2;
    word-break: break-word;
  }
  .kpi-val.is-compact { font-size: 14px; line-height: 1.45; }
  .kpi-val.is-ok { color: #15803d; }
  .kpi-val.is-warn { color: #b45309; }
  .kpi-val.is-err { color: #b91c1c; }
  .kpi-lbl {
    display: block;
    margin-top: 2px;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
  }
  .precedence-bar {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 11px;
    font-size: 12px;
    color: var(--muted);
  }
  .precedence-bar strong { color: var(--text); }
  .notice {
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 12.5px;
    line-height: 1.45;
  }
  .notice-warn {
    background: #fffbeb;
    border: 1px solid #fde68a;
    color: #78350f;
  }
  .notice-err {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #7f1d1d;
  }
  .notice-ok {
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    color: #166534;
  }
  .notice-info {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    color: #1e3a8a;
  }
  .notice-title {
    font-weight: 700;
    margin-bottom: 3px;
  }
  .list-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .list-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 14px;
    background: #f8fafc;
    border-bottom: 1px solid var(--border);
  }
  .list-head h2 {
    margin: 0;
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
  }
  .list-head h2.is-mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .list-sub {
    font-size: 11.5px;
    color: var(--muted);
  }
  .empty-state {
    margin: 0;
    padding: 12px 14px;
    color: var(--muted);
    font-size: 12.5px;
  }
  .entry-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .entry-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 14px;
    border-top: 1px solid var(--border);
  }
  .entry-row:first-child { border-top: 0; }
  .entry-main {
    min-width: 0;
    flex: 1 1 auto;
  }
  .entry-email {
    display: block;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    word-break: break-word;
  }
  .entry-detail {
    display: block;
    margin-top: 2px;
    font-size: 12px;
    color: var(--muted);
  }
  .status-badge {
    flex-shrink: 0;
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
  }
  .badge-ok { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
  .badge-muted { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; }
  .badge-warn { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
  .badge-err { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

  .radio-group {
    margin: 0;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .radio-group legend {
    padding: 0 6px;
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
  }
  .radio-opt {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--bg);
    cursor: pointer;
  }
  .radio-opt input[type="radio"] {
    margin: 2px 0 0;
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    accent-color: var(--accent);
  }
  .radio-opt-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .radio-opt-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }
  .radio-opt-desc {
    font-size: 12px;
    color: var(--muted);
  }

  .status-msg {
    min-height: 22px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
  }
  .status-ok { color: #15803d; }
  .status-err { color: #b91c1c; }

  .footer-bar {
    flex-shrink: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 10px 18px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
  }
  .footer-bar.is-between {
    justify-content: space-between;
  }
  .footer-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .btn, .btn-close {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-block-size: 38px;
    padding: 8px 16px;
    border: 0;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
  }
  .btn-close {
    padding: 8px 22px;
    border-radius: 999px;
    background: var(--accent);
    color: #ffffff;
  }
  .btn-primary {
    background: var(--accent);
    color: #ffffff;
  }
  .btn-outline {
    background: #ffffff;
    color: #334155;
    border: 1px solid #cbd5e1;
  }
  .btn-danger {
    background: #dc2626;
    color: #ffffff;
  }
  .btn-danger-outline {
    background: #ffffff;
    color: #b91c1c;
    border: 1px solid #fca5a5;
  }
  .btn:hover:not(:disabled), .btn-close:hover:not(:disabled) { filter: brightness(0.97); }
  .btn-primary:hover:not(:disabled), .btn-close:hover:not(:disabled) { filter: brightness(1.06); }
  .btn:disabled, .btn-close:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn[hidden], .btn-close[hidden] { display: none; }
  .btn:focus-visible, .btn-close:focus-visible, .radio-opt input:focus-visible {
    outline: 3px solid #0f172a;
    outline-offset: 2px;
  }

  /* Spinner nativo accesible sobre <progress> indeterminado */
  @property --arc-start {
    syntax: "<angle>";
    inherits: false;
    initial-value: 0deg;
  }
  @property --arc-end {
    syntax: "<angle>";
    inherits: false;
    initial-value: 0deg;
  }
  @property --progress-dash-animation {
    syntax: "*";
    inherits: false;
    initial-value: , progress-dash 3s ease-in-out infinite;
  }
  progress.loading-spinner:indeterminate::-webkit-progress-bar {
    display: none;
    background: none;
  }
  progress.loading-spinner:indeterminate::-webkit-progress-value {
    display: none;
    background: none;
  }
  progress.loading-spinner:indeterminate::-moz-progress-bar {
    display: none;
    background: none;
  }
  progress.loading-spinner:indeterminate::slider-fill {
    display: none;
    background: none;
  }
  progress.loading-spinner:indeterminate {
    --_from: calc(90deg + var(--arc-start, 0deg));
    --_to: calc(90deg + var(--arc-end, 158deg));
    --size: 18px;
    --thickness: 2.5px;
    --spinner-color: var(--accent);
    --track-color: #dbeafe;
    --spinner-duration: 1.2s;
    --_used-spinner-duration: var(--spinner-duration);

    position: relative;
    flex-shrink: 0;
    width: var(--size);
    height: var(--size);
    border-radius: 50%;
    appearance: none;
    background: conic-gradient(
        from var(--_from),
        var(--spinner-color) calc(var(--_to) - var(--_from)),
        transparent 0
      )
      var(--track-color);
    animation:
      progress-spin var(--_used-spinner-duration) linear infinite
      var(--progress-dash-animation, );
  }
  progress.loading-spinner[hidden] { display: none; }
  @supports (background-clip: border-area) {
    progress.loading-spinner:indeterminate {
      background-clip: border-area;
      border: var(--thickness) solid transparent;
      background-origin: border-box;
    }
  }
  @supports not (background-clip: border-area) {
    progress.loading-spinner:indeterminate {
      --clip-boundary: calc(100% - var(--thickness));
      -webkit-mask-image: radial-gradient(
        farthest-side,
        transparent var(--clip-boundary),
        black var(--clip-boundary)
      );
      mask-image: radial-gradient(
        farthest-side,
        transparent var(--clip-boundary),
        black var(--clip-boundary)
      );
      border: 0;
    }
  }
  @media (forced-colors: active) {
    progress.loading-spinner:indeterminate {
      forced-color-adjust: none;
      --spinner-color: CanvasText;
      --track-color: Canvas;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    progress.loading-spinner:indeterminate {
      --_used-spinner-duration: 6s;
      --progress-dash-animation: ;
      --arc-end: 158deg;
    }
  }
  @keyframes progress-spin {
    to { rotate: 1turn; }
  }
  @keyframes progress-dash {
    from { --arc-start: 0deg; --arc-end: 3deg; }
    50% { --arc-start: 100deg; --arc-end: 358deg; }
    to { --arc-start: 360deg; --arc-end: 363deg; }
  }
</style>
